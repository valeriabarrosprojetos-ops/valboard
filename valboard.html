<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Val Board</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg:#0F0E0C; --surface:#1A1916; --surface2:#222118; --surface3:#2A2820;
  --border:rgba(255,255,255,0.07); --border2:rgba(255,255,255,0.12);
  --text:#F2EDE4; --text2:#9E9A92; --text3:#5E5B55;
  --gold:#C9A84C; --green:#6A9E78; --red:#C05050; --blue:#5B8FA8;
  --violet:#8B7BAD; --orange:#C8824A; --eng:#6B9EBF;
  --radius:10px;
}
body { background:var(--bg); color:var(--text); font-family:'Segoe UI',sans-serif; min-height:100vh; }

/* ── HEADER ── */
.header { background:var(--surface); border-bottom:1px solid var(--border); padding:0 16px; height:54px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:50; }
.brand { font-size:17px; font-weight:700; letter-spacing:-.5px; }
.header-right { display:flex; align-items:center; gap:8px; }
.btn-new { background:var(--gold); color:#000; border:none; padding:7px 16px; border-radius:8px; font-weight:700; font-size:12px; cursor:pointer; display:none; }
.btn-backup { background:var(--surface2); border:1px solid var(--border2); color:var(--text2); padding:7px 12px; border-radius:8px; font-size:12px; cursor:pointer; }

/* ── NAV ── */
.nav { background:var(--surface); border-bottom:1px solid var(--border); display:flex; overflow-x:auto; }
.nav-tab { padding:12px 18px; font-size:13px; font-weight:600; border:none; cursor:pointer; background:none; color:var(--text3); border-bottom:2px solid transparent; white-space:nowrap; flex-shrink:0; }
.nav-tab.active { color:var(--text); border-bottom-color:var(--gold); }

/* ── PAGES ── */
.page { display:none; }
.page.active { display:block; }

/* ── HOME ── */
.home-grid { display:grid; grid-template-columns:1fr; gap:14px; padding:16px; }
@media(min-width:768px) { .home-grid { grid-template-columns:1fr 1fr; } }
@media(min-width:1100px) { .home-grid { grid-template-columns:1.5fr 1fr 1fr; } }
.home-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; }
.home-card-head { padding:12px 16px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
.home-card-title { font-size:13px; font-weight:700; }
.home-card-body { padding:14px 16px; }

/* Agenda */
.agenda-item { display:flex; align-items:flex-start; gap:10px; padding:8px 0; border-bottom:1px solid var(--border); }
.agenda-item:last-child { border:none; }
.agenda-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; margin-top:4px; }
.agenda-title { font-size:12px; font-weight:600; color:var(--text); }
.agenda-sub { font-size:10px; color:var(--text3); margin-top:2px; }
.agenda-date { font-size:10px; font-weight:700; text-align:right; flex-shrink:0; }

/* Resumo financeiro */
.fin-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.fin-item { background:var(--surface2); border-radius:8px; padding:10px 12px; }
.fin-label { font-size:10px; color:var(--text3); margin-bottom:3px; }
.fin-value { font-size:18px; font-weight:700; }

/* ── BOARD ── */
.board-wrap { padding:14px; overflow-x:auto; }
.board { display:flex; gap:12px; align-items:flex-start; min-width:max-content; }
.col { width:285px; background:var(--surface); border-radius:var(--radius); border:1px solid var(--border); flex-shrink:0; }
.col-bar { height:3px; border-radius:2px 2px 0 0; }
.col-head { padding:11px 13px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
.col-title { font-size:12px; font-weight:700; letter-spacing:.5px; }
.col-count { background:var(--surface3); color:var(--text3); font-size:11px; font-weight:700; padding:2px 7px; border-radius:20px; }
.col-body { padding:8px; display:flex; flex-direction:column; gap:7px; min-height:60px; }

/* ── CARDS ── */
.card { border:1px solid var(--border); border-radius:8px; padding:11px; font-size:12px; }
.card:hover { border-color:var(--border2); }
.card-title { font-size:13px; font-weight:700; color:var(--text); margin-bottom:5px; line-height:1.3; }
.card-head { display:flex; align-items:flex-start; justify-content:space-between; gap:5px; margin-bottom:5px; }
.card-actions { display:flex; gap:3px; flex-shrink:0; }
.card-btn { background:none; border:1px solid var(--border); color:var(--text3); border-radius:5px; padding:2px 6px; font-size:11px; cursor:pointer; }
.card-btn:hover { color:var(--text2); border-color:var(--border2); }
.badges { display:flex; gap:4px; flex-wrap:wrap; margin-bottom:6px; }
.badge { font-size:10px; padding:2px 7px; border-radius:20px; font-weight:600; }
.b-tipo { background:var(--surface3); color:var(--text2); }
.b-pago { background:rgba(106,158,120,0.2); color:var(--green); }
.b-tiktok { background:rgba(201,168,76,0.2); color:var(--gold); }
.b-ugc { background:rgba(139,123,173,0.2); color:var(--violet); }
.b-afil { background:rgba(91,143,168,0.2); color:var(--blue); }
.b-org { background:rgba(106,158,120,0.2); color:var(--green); }
.b-falta { background:rgba(192,80,80,0.18); color:#D47070; border:1px dashed #D47070; }
.b-status-neg { background:rgba(91,143,168,0.2); color:var(--blue); }
.b-status-prop { background:rgba(201,168,76,0.2); color:var(--gold); }
.b-status-vis { background:rgba(139,123,173,0.2); color:var(--violet); }
.b-status-sem { background:rgba(255,255,255,0.05); color:var(--text3); }
.b-check { background:var(--surface3); color:var(--text3); }
.card-footer { display:flex; align-items:center; justify-content:space-between; margin-top:5px; }
.card-due { font-size:11px; color:var(--text3); }
.card-due.overdue { color:var(--red); font-weight:700; }
.card-due.soon { color:var(--orange); font-weight:700; }
.card-value { font-size:15px; font-weight:700; color:var(--gold); }

/* Checklist no card */
.chk-item { display:flex; align-items:center; gap:7px; padding:4px 0; border-bottom:1px solid var(--border); cursor:pointer; }
.chk-box { width:15px; height:15px; border-radius:3px; border:1.5px solid var(--border2); flex-shrink:0; display:flex; align-items:center; justify-content:center; }
.chk-box.done { background:var(--green); border-color:var(--green); }
.chk-label { font-size:11px; color:var(--text2); flex:1; }
.chk-label.done { text-decoration:line-through; color:var(--text3); }
.chk-count { font-size:10px; color:var(--text3); margin-top:3px; }

/* Prospecção */
.prosp-fields { background:var(--surface3); border-radius:7px; padding:7px 9px; margin-bottom:7px; }
.pf { display:flex; gap:5px; font-size:10px; padding:1px 0; }
.pf-lbl { color:var(--text3); min-width:60px; flex-shrink:0; }
.pf-val { color:var(--text2); word-break:break-all; }
.pf-val.empty { color:var(--text3); font-style:italic; }
.timeline { border-top:1px solid var(--border); padding-top:7px; margin-top:7px; }
.tl-hdr { font-size:9px; font-weight:700; color:var(--text3); letter-spacing:1px; text-transform:uppercase; margin-bottom:5px; }
.tl-entry { display:flex; gap:7px; margin-bottom:4px; }
.tl-dot { width:6px; height:6px; border-radius:50%; background:var(--blue); flex-shrink:0; margin-top:3px; }
.tl-dot.old { background:var(--border2); }
.tl-date { font-size:9px; color:var(--text3); min-width:50px; flex-shrink:0; margin-top:1px; }
.tl-text { font-size:10px; color:var(--text2); flex:1; line-height:1.4; }
.tl-empty { font-size:10px; color:var(--text3); font-style:italic; }
.tl-add { display:flex; gap:4px; margin-top:5px; }
.tl-input { flex:1; background:var(--surface); border:1px solid var(--border2); border-radius:5px; padding:4px 7px; color:var(--text); font-size:10px; }
.tl-btn { background:var(--blue); border:none; color:white; padding:4px 9px; border-radius:5px; font-size:10px; font-weight:700; cursor:pointer; }

/* Pessoal */
.mkt-item { display:flex; align-items:center; gap:7px; padding:5px 0; border-bottom:1px solid var(--border); cursor:pointer; }
.mkt-box { width:15px; height:15px; border-radius:3px; border:1.5px solid var(--border2); flex-shrink:0; }
.mkt-add { display:flex; gap:5px; margin-top:7px; }
.mkt-add input { flex:1; background:var(--surface); border:1px solid var(--border2); border-radius:5px; padding:5px 8px; color:var(--text); font-size:11px; }
.mkt-add button { background:var(--surface3); border:1px solid var(--border2); color:var(--text2); padding:5px 10px; border-radius:5px; font-size:11px; cursor:pointer; }
.gcal-btn { display:inline-flex; align-items:center; gap:4px; font-size:10px; padding:3px 8px; border-radius:5px; background:var(--surface3); color:var(--text2); text-decoration:none; border:1px solid var(--border2); }

/* ── FINANCEIRO ── */
.fin-page { padding:16px; max-width:1000px; margin:0 auto; }
.fin-resumo { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
@media(min-width:600px) { .fin-resumo { grid-template-columns:repeat(4,1fr); } }
.fin-box { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; }
.fin-box-label { font-size:10px; color:var(--text3); text-transform:uppercase; letter-spacing:1px; margin-bottom:5px; }
.fin-box-value { font-size:20px; font-weight:700; }
.fin-section { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; margin-bottom:14px; }
.fin-section-head { padding:12px 16px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
.fin-section-title { font-size:13px; font-weight:700; }
.fin-list { padding:10px 16px; max-height:340px; overflow-y:auto; }
.fin-item-row { display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); }
.fin-item-row:last-child { border:none; }
.fin-icon { width:34px; height:34px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0; }
.fin-item-info { flex:1; min-width:0; }
.fin-item-title { font-size:12px; font-weight:600; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.fin-item-sub { font-size:10px; color:var(--text3); margin-top:1px; display:flex; gap:6px; flex-wrap:wrap; }
.fin-item-right { text-align:right; flex-shrink:0; }
.fin-item-value { font-size:15px; font-weight:700; }
.fin-item-status { font-size:10px; font-weight:600; margin-top:2px; }
.fin-filters { display:flex; gap:6px; padding:10px 16px; border-bottom:1px solid var(--border); flex-wrap:wrap; align-items:center; }
.fchip { font-size:11px; padding:4px 11px; border-radius:20px; border:1px solid var(--border2); background:none; color:var(--text3); cursor:pointer; }
.fchip.active { background:var(--surface2); color:var(--text); border-color:var(--border2); }

/* ── MODAIS ── */
.overlay { position:fixed; inset:0; background:rgba(0,0,0,0.75); display:none; align-items:center; justify-content:center; z-index:100; padding:16px; }
.overlay.show { display:flex; }
.modal { background:var(--surface); border:1px solid var(--border2); border-radius:14px; width:100%; max-width:500px; max-height:92vh; overflow-y:auto; padding:20px; }
.modal-title { font-size:16px; font-weight:700; margin-bottom:14px; }
.fg { margin-bottom:11px; }
.fl { font-size:10px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:var(--text3); display:block; margin-bottom:5px; }
.fi, .fs, .fta { width:100%; background:var(--surface2); border:1px solid var(--border2); border-radius:8px; padding:9px 12px; color:var(--text); font-size:13px; }
.fta { min-height:70px; resize:vertical; line-height:1.6; }
.fr { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.modal-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; }
.btn-cancel { background:none; border:1px solid var(--border2); color:var(--text2); padding:9px 18px; border-radius:8px; cursor:pointer; font-size:13px; }
.btn-save { background:var(--gold); color:#000; border:none; padding:9px 22px; border-radius:8px; font-weight:700; cursor:pointer; font-size:13px; }
.pago-toggle { display:flex; align-items:center; gap:10px; padding:9px 12px; background:var(--surface2); border:1px solid var(--border2); border-radius:8px; cursor:pointer; }
.pago-toggle.on { border-color:var(--green); background:rgba(106,158,120,0.1); }
.pago-check { width:18px; height:18px; border-radius:4px; border:2px solid var(--border2); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.pago-check.on { background:var(--green); border-color:var(--green); }
.pago-aviso { margin-top:6px; padding:8px 12px; background:rgba(106,158,120,0.1); border-radius:8px; font-size:12px; color:var(--green); display:none; }
.modal-tabs { display:flex; border-bottom:1px solid var(--border); margin-bottom:12px; }
.modal-tab { flex:1; padding:9px 0; font-size:12px; border:none; cursor:pointer; background:none; color:var(--text3); border-bottom:2px solid transparent; font-weight:600; }
.modal-tab.active { color:var(--gold); border-bottom-color:var(--gold); }
.tab-pane { display:none; }
.tab-pane.active { display:block; }
.chk-add { display:flex; gap:6px; margin-top:6px; }
.chk-add input { flex:1; background:var(--surface2); border:1px solid var(--border2); border-radius:6px; padding:6px 10px; color:var(--text); font-size:12px; }
.chk-add button { background:var(--surface3); border:1px solid var(--border2); color:var(--text2); padding:6px 12px; border-radius:6px; font-size:12px; cursor:pointer; }

.drag-over { background:rgba(255,255,255,0.03) !important; }
.card-dragging { opacity:.4; }
.drive-link { display:inline-flex; align-items:center; gap:4px; font-size:10px; padding:3px 8px; border-radius:5px; background:var(--surface3); color:var(--text2); text-decoration:none; border:1px solid var(--border2); margin-top:5px; }

/* ── SEARCH BAR ── */
.search-bar-wrap { padding:10px 14px 0; }
.search-bar { display:flex; align-items:center; gap:8px; background:var(--surface2); border:1px solid var(--border2); border-radius:9px; padding:8px 12px; }
.search-bar input { background:none; border:none; outline:none; color:var(--text); font-size:13px; flex:1; }
.search-bar input::placeholder { color:var(--text3); }
.search-bar-icon { color:var(--text3); font-size:14px; }
.search-count { font-size:11px; color:var(--text3); flex-shrink:0; }

/* Mobile */
@media(max-width:767px) {
  .nav-tab { padding:10px 13px; font-size:12px; }
  .board-wrap { padding:10px 8px; }
  .col { width:265px; }
}
</style>
</head>
<body>

<div class="header">
  <div class="brand">✦ Val Board</div>
  <div class="header-right">
    <span id="syncStatus" style="font-size:10px;color:var(--text3);"></span>
    <button class="btn-new" id="btnNew" onclick="openNew()">+ Novo</button>
    <button class="btn-backup" onclick="exportBackup()">📥 Backup</button>
  </div>
</div>

<div class="nav">
  <button class="nav-tab active" onclick="switchPage('home',this)">🏠 Home</button>
  <button class="nav-tab" onclick="switchPage('prospeccao',this)">📞 Prospecção</button>
  <button class="nav-tab" onclick="switchPage('conteudo',this)">🎬 Conteúdo</button>
  <button class="nav-tab" onclick="switchPage('engenharia',this)">📐 Engenharia</button>
  <button class="nav-tab" onclick="switchPage('pessoal',this)">🏠 Pessoal</button>
  <button class="nav-tab" onclick="switchPage('financeiro',this)">💰 Financeiro</button>
</div>

<!-- HOME -->
<div class="page active" id="page-home">
  <div class="home-grid">
    <div class="home-card" style="grid-row:span 2;">
      <div class="home-card-head"><span class="home-card-title">📅 Agenda</span><span id="todayLbl" style="font-size:10px;color:var(--text3);"></span></div>
      <div class="home-card-body" id="agendaBody" style="max-height:420px;overflow-y:auto;padding:0 16px;"></div>
    </div>
    <div class="home-card">
      <div class="home-card-head"><span class="home-card-title">💰 Financeiro</span><button style="font-size:11px;padding:4px 10px;background:var(--surface3);border:1px solid var(--border2);color:var(--text2);border-radius:6px;cursor:pointer;" onclick="switchPage('financeiro',document.querySelectorAll('.nav-tab')[5])">Ver tudo</button></div>
      <div class="home-card-body" id="homeFinBody"></div>
    </div>
    <div class="home-card">
      <div class="home-card-head"><span class="home-card-title">📊 Resumo</span></div>
      <div class="home-card-body" id="homeResumoBody"></div>
    </div>
  </div>
</div>

<!-- PROSPECÇÃO -->
<div class="page" id="page-prospeccao">
  <div class="search-bar-wrap">
    <div class="search-bar">
      <span class="search-bar-icon">🔍</span>
      <input type="text" id="search-prospeccao" placeholder="Pesquisar em prospeccao..." oninput="renderBoard('prospeccao')" />
      <span class="search-count" id="search-count-prospeccao"></span>
      <button onclick="document.getElementById('search-prospeccao').value='';renderBoard('prospeccao')" style="background:none;border:none;color:var(--text3);cursor:pointer;font-size:14px;padding:0;display:none;" id="search-clear-prospeccao">✕</button>
    </div>
  </div>
  <div class="board-wrap"><div class="board" id="board-prospeccao"></div></div>
</div>

<!-- CONTEÚDO -->
<div class="page" id="page-conteudo">
  <div class="search-bar-wrap">
    <div class="search-bar">
      <span class="search-bar-icon">🔍</span>
      <input type="text" id="search-conteudo" placeholder="Pesquisar em conteudo..." oninput="renderBoard('conteudo')" />
      <span class="search-count" id="search-count-conteudo"></span>
      <button onclick="document.getElementById('search-conteudo').value='';renderBoard('conteudo')" style="background:none;border:none;color:var(--text3);cursor:pointer;font-size:14px;padding:0;display:none;" id="search-clear-conteudo">✕</button>
    </div>
  </div>
  <div class="board-wrap"><div class="board" id="board-conteudo"></div></div>
</div>

<!-- ENGENHARIA -->
<div class="page" id="page-engenharia">
  <div class="search-bar-wrap">
    <div class="search-bar">
      <span class="search-bar-icon">🔍</span>
      <input type="text" id="search-engenharia" placeholder="Pesquisar em engenharia..." oninput="renderBoard('engenharia')" />
      <span class="search-count" id="search-count-engenharia"></span>
      <button onclick="document.getElementById('search-engenharia').value='';renderBoard('engenharia')" style="background:none;border:none;color:var(--text3);cursor:pointer;font-size:14px;padding:0;display:none;" id="search-clear-engenharia">✕</button>
    </div>
  </div>
  <div class="board-wrap"><div class="board" id="board-engenharia"></div></div>
</div>

<!-- PESSOAL -->
<div class="page" id="page-pessoal">
  <div class="search-bar-wrap">
    <div class="search-bar">
      <span class="search-bar-icon">🔍</span>
      <input type="text" id="search-pessoal" placeholder="Pesquisar em pessoal..." oninput="renderBoard('pessoal')" />
      <span class="search-count" id="search-count-pessoal"></span>
      <button onclick="document.getElementById('search-pessoal').value='';renderBoard('pessoal')" style="background:none;border:none;color:var(--text3);cursor:pointer;font-size:14px;padding:0;display:none;" id="search-clear-pessoal">✕</button>
    </div>
  </div>
  <div class="board-wrap"><div class="board" id="board-pessoal"></div></div>
</div>

<!-- FINANCEIRO -->
<div class="page" id="page-financeiro">
  <div class="fin-page">
    <button style="width:100%;margin-bottom:14px;padding:14px;background:var(--gold);color:#000;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;" onclick="openLanc()">+ Novo Lançamento</button>
    <div class="fin-resumo" id="finResumo"></div>
    <div class="fin-section">
      <div class="fin-section-head"><span class="fin-section-title">📝 Lançamentos</span></div>
      <div class="fin-filters">
        <button class="fchip active" onclick="setLancFiltro('todos',this)">Todos</button>
        <button class="fchip" onclick="setLancFiltro('entrada',this)" style="color:var(--green)">↑ Entradas</button>
        <button class="fchip" onclick="setLancFiltro('saida',this)" style="color:var(--red)">↓ Saídas</button>
        <select class="fi" id="lancMesFiltro" onchange="renderLancs()" style="padding:4px 8px;font-size:11px;width:auto;border-radius:20px;margin-left:auto;"></select>
      </div>
      <div class="fin-list" id="lancList"></div>
    </div>
    <div class="fin-section">
      <div class="fin-section-head"><span class="fin-section-title">📋 A Receber (dos cards)</span></div>
      <div class="fin-list" id="aReceberList"></div>
    </div>
  </div>
</div>

<!-- MODAL GERAL -->
<div class="overlay" id="modalGeral" onclick="if(event.target===this)closeGeral()">
  <div class="modal" id="modalGeralContent"></div>
</div>

<!-- MODAL LANÇAMENTO -->
<div class="overlay" id="modalLanc" onclick="if(event.target===this)closeLanc()">
  <div class="modal">
    <div class="modal-title" id="lancTitle">Novo Lançamento</div>
    <div class="fg">

// ── UTILS ─────────────────────────────────────────────────────────────
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function today() { return new Date().toISOString().split('T')[0]; }
function fmtDate(d) { if(!d) return ''; const [y,m,dy]=d.split('-'); return `${dy}/${m}/${y}`; }
function fmtDateShort(d) { if(!d) return ''; const [y,m,dy]=d.split('-'); return `${dy}/${m}`; }
function fmtMoney(v) { return 'R$ ' + parseFloat(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2}); }
function addDays(d,n) { const dt=new Date(d+'T12:00:00'); dt.setDate(dt.getDate()+n); return dt.toISOString().split('T')[0]; }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function dueClass(due, col) {
  if (!due || col === 'done' || col === 'fechado') return '';
  const t = today();
  if (due < t) return 'overdue';
  if (due <= addDays(t,3)) return 'soon';
  return '';
}
function dueIcon(due, col) {
  const dc = dueClass(due, col);
  return dc === 'overdue' ? '⚠️' : dc === 'soon' ? '🔔' : '📅';
}

  document.getElementById('page-' + page).classList.add('active');

  btnNew.style.display = ['prospeccao','conteudo','engenharia','pessoal'].includes(page) ? 'block' : 'none';
  if (page === 'home') renderHome();
  else if (page === 'prospeccao') renderBoard('prospeccao');
  else if (page === 'conteudo') renderBoard('conteudo');

}

function onDragStart(e, id) { dragId = id; setTimeout(() => document.getElementById('card-'+id)?.classList.add('card-dragging'), 0); }
function onDragEnd(e) { document.querySelectorAll('.card-dragging').forEach(el => el.classList.remove('card-dragging')); dragId = null; }
function onDragOver(e) { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
function onDragLeave(e) { e.currentTarget.classList.remove('drag-over'); }
function onDrop(e, col, quadro) {
  e.preventDefault(); e.currentTarget.classList.remove('drag-over');
  const cards = getCards(quadro);
  const c = cards.find(x => x.id === dragId);
  if (c) { c.col = col; saveCards(quadro); renderBoard(quadro); }
}

// ── DADOS POR QUADRO ─────────────────────────────────────────────────
function getCards(quadro) {
  const key = 'vb_cards_' + quadro;
  const saved = localStorage.getItem(key);
  if (saved) return JSON.parse(saved);
  const defaults = { prospeccao: cardsProsp, conteudo: cardsCont, engenharia: cardsEng, pessoal: cardsPes };
  return JSON.parse(JSON.stringify(defaults[quadro] || []));
}
function saveCards(quadro) {
  localStorage.setItem('vb_cards_' + quadro, JSON.stringify(getCards(quadro)));
}
function updateCard(quadro, id, data) {
  const cards = getCards(quadro);
  const idx = cards.findIndex(c => c.id === id);
  if (idx > -1) { Object.assign(cards[idx], data); localStorage.setItem('vb_cards_' + quadro, JSON.stringify(cards)); }
}
function deleteCard(quadro, id) {
  const cards = getCards(quadro).filter(c => c.id !== id);
  localStorage.setItem('vb_cards_' + quadro, JSON.stringify(cards));
}
function addCard(quadro, card) {
  const cards = getCards(quadro);
  cards.unshift(card);
  localStorage.setItem('vb_cards_' + quadro, JSON.stringify(cards));
}
function toggleChk(quadro, cardId, idx) {
  const cards = getCards(quadro);
  const c = cards.find(x => x.id === cardId);
  if (c && c.checklist) { c.checklist[idx].done = !c.checklist[idx].done; localStorage.setItem('vb_cards_' + quadro, JSON.stringify(cards)); renderBoard(quadro); }
}
function removeMkt(cardId, idx) {
  const cards = getCards('pessoal');
  const c = cards.find(x => x.id === cardId);
  if (c && c.checklist) { c.checklist.splice(idx,1); localStorage.setItem('vb_cards_pessoal', JSON.stringify(cards)); renderBoard('pessoal'); }
}
function addMkt(cardId) {
  const input = document.getElementById('mkt-'+cardId);
  if (!input || !input.value.trim()) return;
  const cards = getCards('pessoal');
  const c = cards.find(x => x.id === cardId);
  if (c) { if(!c.checklist)c.checklist=[]; c.checklist.push({text:input.value.trim(),done:false}); localStorage.setItem('vb_cards_pessoal', JSON.stringify(cards)); renderBoard('pessoal'); }
}
function addTlEntry(quadro, cardId) {
  const input = document.getElementById('tl-'+cardId);
  if (!input || !input.value.trim()) return;
  const cards = getCards(quadro);
  const c = cards.find(x => x.id === cardId);
  if (c) {
    if (!c.timeline) c.timeline = [];
    c.timeline.push({ date: new Date().toLocaleDateString('pt-BR'), text: input.value.trim() });
    localStorage.setItem('vb_cards_' + quadro, JSON.stringify(cards));
    input.value = '';
    renderBoard(quadro);
  }
}

function renderBoard(quadro) {
  const board = document.getElementById('board-'+quadro);
  if (!board) return;
  const allCards = getCards(quadro);
  const cols = COLS[quadro];

  // Filtro de pesquisa
  const searchInput = document.getElementById('search-'+quadro);
  const query = searchInput ? searchInput.value.trim().toLowerCase() : '';
  const clearBtn = document.getElementById('search-clear-'+quadro);
  if (clearBtn) clearBtn.style.display = query ? 'block' : 'none';

  const cards = query ? allCards.filter(c => {
    const fields = [c.title, c.contato, c.email, c.tel, c.cidade, c.segmento, c.obs, c.tipo, c.etiqueta, c.origem, c.status].filter(Boolean).join(' ').toLowerCase();
    return fields.includes(query);
  }) : allCards;

  // Contador
  const countEl = document.getElementById('search-count-'+quadro);
  if (countEl) countEl.textContent = query ? `${cards.length} resultado${cards.length!==1?'s':''}` : '';

  board.innerHTML = cols.map(col => {
    const colCards = cards.filter(c => c.col === col.id);
    return `<div class="col">
      <div class="col-bar" style="background:${col.color}"></div>
      <div class="col-head">
        <span class="col-title" style="color:${col.color}">${col.label}</span>
        <span class="col-count">${colCards.length}</span>
      </div>
      <div class="col-body" id="col-${quadro}-${col.id}"
        ondragover="onDragOver(event)" ondrop="onDrop(event,'${col.id}','${quadro}')" ondragleave="onDragLeave(event)">
        ${colCards.map(c => cardHTML(c, quadro)).join('')}
      </div>
    </div>`;
  }).join('');
}

function cardHTML(c, q) {
  if (q === 'prospeccao') return prospCardHTML(c, q);
  if (q === 'pessoal') return pesCardHTML(c, q);
  if (q === 'engenharia') return engCardHTML(c, q);
  return contCardHTML(c, q);
}

function pField(icon, label, val) {
  const empty = !val || !val.trim();
  return `<div class="pf"><span class="pf-lbl">${icon} ${label}</span><span class="pf-val ${empty?'empty':''}">${empty?'não informado':esc(val)}</span></div>`;
}

// ── CARD PESSOAL ─────────────────────────────────────────────────────
function pesCardHTML(c, q) {
  const dc = dueClass(c.due, c.col);
  const isMercado = c.col === 'mercado';
  const isComp = c.col === 'backlog';
  const isList = c.col === 'doing' || c.col === 'review';
  const chkTotal = (c.checklist||[]).length;
  const chkDone = (c.checklist||[]).filter(i=>i.done).length;
  const borderColors = {doing:'#C8824A',backlog:'#6B9EBF',review:'#8B7BAD',mercado:'#6A9E78',done:'#6A9E78'};

  const chkHTML = isList && chkTotal > 0 ? `<div style="margin:4px 0 5px;">${(c.checklist||[]).map((item,i)=>`
    <div class="chk-item" onclick="toggleChk('${q}','${c.id}',${i})">
      <div class="chk-box ${item.done?'done':''}">${item.done?'<span style="color:white;font-size:9px;font-weight:900;">✓</span>':''}</div>
      <span class="chk-label ${item.done?'done':''}">${esc(item.text)}</span>
    </div>`).join('')}
    <div class="chk-count">${chkDone}/${chkTotal} concluídos</div></div>` : '';

  const mktHTML = isMercado ? `<div style="margin:4px 0 5px;">${(c.checklist||[]).map((item,i)=>`
    <div class="mkt-item" onclick="removeMkt('${c.id}',${i})">
      <div class="mkt-box"></div><span style="font-size:11px;color:var(--text2);">${esc(item.text)}</span>
    </div>`).join('')}</div>
    <div class="mkt-add"><input id="mkt-${c.id}" type="text" placeholder="Adicionar item..." onkeydown="if(event.key==='Enter')addMkt('${c.id}')" onclick="event.stopPropagation()" /><button onclick="event.stopPropagation();addMkt('${c.id}')">+ Add</button></div>` : '';

  const gcalLink = isComp && c.due ? (() => {
    const dt = c.due.replace(/-/g,'');
    const h = c.hora ? c.hora.replace(':','') : '080000';
    return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(c.title)}&dates=${dt}T${h}00/${dt}T${h}00&details=${encodeURIComponent(c.obs||'')}`;
  })() : '';

  return `<div class="card" id="card-${c.id}" draggable="true" ondragstart="onDragStart(event,'${c.id}')" ondragend="onDragEnd(event)" style="background:var(--surface2);border-left:3px solid ${borderColors[c.col]||'#9E9A92'};">
    <div class="card-head">
      <div class="card-title">${esc(c.title)}</div>
      <div class="card-actions">
        <button class="card-btn" onclick="event.stopPropagation();openEdit('${q}','${c.id}')">✏️</button>
        <button class="card-btn" onclick="event.stopPropagation();askDelete('${q}','${c.id}')">🗑️</button>
      </div>
    </div>
    ${chkHTML}${mktHTML}
    ${isComp ? `${c.obs?`<div style="font-size:11px;color:var(--text3);margin:3px 0 7px;line-height:1.4;">${esc(c.obs.slice(0,80))}${c.obs.length>80?'...':''}</div>`:''}
    <div class="card-footer">
      <span class="card-due ${dc}">📅 ${c.due?fmtDate(c.due):''} ${c.hora?'às '+c.hora:''}</span>
      ${gcalLink?`<a class="gcal-btn" href="${gcalLink}" target="_blank" onclick="event.stopPropagation()">📅 Google Cal</a>`:''}
    </div>` : ''}
    ${!isComp && !chkHTML && !mktHTML && c.due ? `<div class="card-footer"><span class="card-due ${dc}">📅 ${fmtDate(c.due)}</span></div>` : ''}
  </div>`;
}

// ── HOME ─────────────────────────────────────────────────────────────
function renderHome() {
  const t = today();
  document.getElementById('todayLbl').textContent = fmtDate(t);

  // Agenda: cards com prazo hoje ou atrasados de todos os quadros
  const allCards = [
    ...getCards('conteudo').map(c=>({...c,_q:'🎬'})),
    ...getCards('engenharia').map(c=>({...c,_q:'📐'})),
    ...getCards('prospeccao').map(c=>({...c,_q:'📞'})),
    ...getCards('pessoal').map(c=>({...c,_q:'🏠'})),
  ];
  const agenda = allCards.filter(c => c.due && c.due <= addDays(t,3) && c.col !== 'done' && c.col !== 'fechado' && c.col !== 'done').sort((a,b)=>a.due.localeCompare(b.due));

  const agendaHTML = agenda.length ? agenda.map(c => {
    const dc = dueClass(c.due, c.col);
    const color = dc==='overdue'?'var(--red)':dc==='soon'?'var(--orange)':'var(--blue)';
    return `<div class="agenda-item">
      <div class="agenda-dot" style="background:${color}"></div>
      <div style="flex:1;min-width:0;">
        <div class="agenda-title">${esc(c.title)}</div>
        <div class="agenda-sub">${c._q} ${c.cidade||c.tipo||''}</div>
      </div>
      <div class="agenda-date" style="color:${color};">${fmtDateShort(c.due)}</div>
    </div>`;
  }).join('') : '<div style="padding:16px;font-size:12px;color:var(--text3);text-align:center;">Nenhum prazo nos próximos 3 dias ✓</div>';

  document.getElementById('agendaBody').innerHTML = agendaHTML;

  // Resumo financeiro
  const totalEntradas = lancamentos.filter(l=>l.tipo==='entrada').reduce((a,l)=>a+parseFloat(l.valor||0),0);
  const totalSaidas   = lancamentos.filter(l=>l.tipo==='saida').reduce((a,l)=>a+parseFloat(l.valor||0),0);
  const aReceber = [...getCards('conteudo'),...getCards('engenharia')].filter(c=>c.valor>0&&!c.pago&&c.col!=='done').reduce((a,c)=>a+parseFloat(c.valor||0),0);
  const saldo = totalEntradas - totalSaidas;

  document.getElementById('homeFinBody').innerHTML = `
    <div class="fin-grid">
      <div class="fin-item"><div class="fin-label">Entradas</div><div class="fin-value" style="color:var(--green)">${fmtMoney(totalEntradas)}</div></div>
      <div class="fin-item"><div class="fin-label">Saídas</div><div class="fin-value" style="color:var(--red)">${fmtMoney(totalSaidas)}</div></div>
      <div class="fin-item"><div class="fin-label">Saldo</div><div class="fin-value" style="color:${saldo>=0?'var(--green)':'var(--red)'}">${fmtMoney(saldo)}</div></div>
      <div class="fin-item"><div class="fin-label">A Receber</div><div class="fin-value" style="color:var(--gold)">${fmtMoney(aReceber)}</div></div>
    </div>`;

  // Resumo geral
  const totais = {
    prosp: getCards('prospeccao').length,
    cont: getCards('conteudo').filter(c=>c.col!=='done').length,
    eng: getCards('engenharia').filter(c=>c.col!=='done').length,
    pes: getCards('pessoal').filter(c=>c.col!=='done').length,
  };
  document.getElementById('homeResumoBody').innerHTML = `
    <div style="display:flex;flex-direction:column;gap:8px;">
      ${[['📞','Clientes prospecção',totais.prosp,'var(--blue)'],['🎬','Conteúdo em aberto',totais.cont,'var(--gold)'],['📐','Projetos em andamento',totais.eng,'var(--eng)'],['🏠','Tarefas pessoais',totais.pes,'var(--violet)']].map(([icon,label,val,color])=>`
      <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);">
        <span style="font-size:12px;color:var(--text2);">${icon} ${label}</span>
        <span style="font-size:16px;font-weight:700;color:${color};">${val}</span>
      </div>`).join('')}
    </div>`;
}

// ── FINANCEIRO ────────────────────────────────────────────────────────
function renderFinanceiro() {
  const totalE = lancamentos.filter(l=>l.tipo==='entrada').reduce((a,l)=>a+parseFloat(l.valor||0),0);
  const totalS = lancamentos.filter(l=>l.tipo==='saida').reduce((a,l)=>a+parseFloat(l.valor||0),0);
  const saldo = totalE - totalS;
  const aRec = [...getCards('conteudo'),...getCards('engenharia')].filter(c=>c.valor>0&&!c.pago&&c.col!=='done').reduce((a,c)=>a+parseFloat(c.valor||0),0);

  document.getElementById('finResumo').innerHTML = `
    <div class="fin-box"><div class="fin-box-label">↑ Entradas</div><div class="fin-box-value" style="color:var(--green)">${fmtMoney(totalE)}</div></div>
    <div class="fin-box"><div class="fin-box-label">↓ Saídas</div><div class="fin-box-value" style="color:var(--red)">${fmtMoney(totalS)}</div></div>
    <div class="fin-box"><div class="fin-box-label">= Saldo</div><div class="fin-box-value" style="color:${saldo>=0?'var(--green)':'var(--red)'}">${fmtMoney(saldo)}</div></div>
    <div class="fin-box"><div class="fin-box-label">📋 A Receber</div><div class="fin-box-value" style="color:var(--gold)">${fmtMoney(aRec)}</div></div>`;

  renderLancs();
  renderAReceber();
}

function renderLancs() {
  const sel = document.getElementById('lancMesFiltro');
  if (sel && sel.options.length <= 1) {
    const meses = [...new Set(lancamentos.map(l=>l.data.slice(0,7)))].sort().reverse();
    const hm = today().slice(0,7);
    if (!meses.includes(hm)) meses.unshift(hm);
    const nomes = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
    sel.innerHTML = `<option value="">Todos os meses</option>` + meses.map(m => {
      const [y,mo] = m.split('-');
      return `<option value="${m}">${nomes[parseInt(mo)-1]} ${y}</option>`;
    }).join('');
  }
  const mesFiltro = sel ? sel.value : '';
  let items = [...lancamentos];
  if (lancFiltroAtual !== 'todos') items = items.filter(l=>l.tipo===lancFiltroAtual);
  if (mesFiltro) items = items.filter(l=>l.data.startsWith(mesFiltro));
  items.sort((a,b)=>b.data.localeCompare(a.data));

  const el = document.getElementById('lancList');
  if (!el) return;
  if (!items.length) { el.innerHTML = '<div style="padding:16px;font-size:12px;color:var(--text3);text-align:center;">Nenhum lançamento</div>'; return; }

  const stColor = {pago:'var(--green)',pendente:'var(--gold)',atrasado:'var(--red)'};
  el.innerHTML = items.map(l => `
    <div class="fin-item-row">
      <div class="fin-icon" style="background:${l.tipo==='entrada'?'rgba(106,158,120,0.15)':'rgba(192,80,80,0.15)'};">${l.tipo==='entrada'?'↑':'↓'}</div>
      <div class="fin-item-info">
        <div class="fin-item-title">${esc(l.desc)}</div>
        <div class="fin-item-sub"><span>${l.cat}</span><span>${fmtDate(l.data)}</span>${l.obs?`<span>${esc(l.obs)}</span>`:''}</div>
      </div>
      <div class="fin-item-right">
        <div class="fin-item-value" style="color:${l.tipo==='entrada'?'var(--green)':'var(--red)'};">${l.tipo==='entrada'?'+':'-'}${fmtMoney(l.valor)}</div>
        <div class="fin-item-status" style="color:${stColor[l.status]||'var(--text3)'};">${l.status}</div>
      </div>
      <div style="display:flex;gap:3px;flex-shrink:0;">
        <button class="card-btn" onclick="editLanc('${l.id}')">✏️</button>
        <button class="card-btn" style="color:var(--red)" onclick="deleteLanc('${l.id}')">🗑️</button>
      </div>
    </div>`).join('');
}

function renderAReceber() {
  const el = document.getElementById('aReceberList');
  if (!el) return;
  const items = [...getCards('conteudo'),...getCards('engenharia')].filter(c=>c.valor>0&&!c.pago&&c.col!=='done').sort((a,b)=>(a.payDate||'').localeCompare(b.payDate||''));
  if (!items.length) { el.innerHTML = '<div style="padding:16px;font-size:12px;color:var(--text3);text-align:center;">Nenhum valor a receber</div>'; return; }
  el.innerHTML = items.map(c => `
    <div class="fin-item-row">
      <div class="fin-item-info">
        <div class="fin-item-title">${esc(c.title)}</div>
        <div class="fin-item-sub"><span>${c.tipo||''}</span>${c.payDate?`<span>💰 ${fmtDate(c.payDate)}</span>`:''}</div>
      </div>
      <span class="fin-item-value" style="color:var(--gold);">${fmtMoney(c.valor)}</span>
    </div>`).join('');
}

function setLancFiltro(f, btn) {
  lancFiltroAtual = f;
  document.querySelectorAll('#page-financeiro .fchip').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderLancs();
}

// ── LANÇAMENTOS ───────────────────────────────────────────────────────
function openLanc() {
  lancEditId = null; lancTipoAtual = 'entrada';
  document.getElementById('lancTitle').textContent = 'Novo Lançamento';
  ['lDesc','lObs'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('lValor').value='';
  document.getElementById('lData').value=today();
  document.getElementById('lCat').value='conteudo';
  document.getElementById('lStatus').value='pago';
  setLancTipo('entrada');
  document.getElementById('modalLanc').classList.add('show');
  setTimeout(()=>document.getElementById('lDesc').focus(),80);
}
function closeLanc() { document.getElementById('modalLanc').classList.remove('show'); lancEditId=null; }
function setLancTipo(tipo) {
  lancTipoAtual = tipo;
  const be = document.getElementById('btnEnt');

function togglePagoModal() {
  pagoAtivo = !pagoAtivo;
  const toggle = document.getElementById('m_pago_toggle');
  const check  = document.getElementById('m_pago_check');
  const label  = document.getElementById('m_pago_label');
  const aviso  = document.getElementById('m_pago_aviso');
  if (!toggle) return;
  toggle.classList.toggle('on', pagoAtivo);
  check.classList.toggle('on', pagoAtivo);
  check.innerHTML = pagoAtivo ? '<span style="color:white;font-size:11px;font-weight:900;">✓</span>' : '';
  if (label) { label.textContent = pagoAtivo ? 'Pago ✅' : 'Marcar como pago'; label.style.color = pagoAtivo ? 'var(--green)' : 'var(--text2)'; }
  if (aviso) aviso.style.display = pagoAtivo ? 'block' : 'none';
}

  if (!el) return;
  el.innerHTML = modalChkItems.map((item, i) => `
    <div style="display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--surface2);border-radius:6px;margin-bottom:4px;">
      <div onclick="modalChkItems[${i}].done=!modalChkItems[${i}].done;renderModalChk()"
        style="width:16px;height:16px;border-radius:3px;border:1.5px solid ${item.done?'var(--green)':'var(--border2)'};background:${item.done?'var(--green)':'none'};display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;">
        ${item.done?'<span style="color:white;font-size:9px;font-weight:900;">✓</span>':''}
      </div>
      <span style="font-size:12px;color:${item.done?'var(--text3)':'var(--text2)'};text-decoration:${item.done?'line-through':'none'};flex:1;">${esc(item.text)}</span>
      <button onclick="modalChkItems.splice(${i},1);renderModalChk()" style="background:none;border:none;color:var(--text3);cursor:pointer;font-size:14px;">×</button>
    </div>`).join('') || '<div style="font-size:12px;color:var(--text3);padding:6px 0;">Nenhum item ainda</div>';
}

function addModalChkItem() {
  const input = document.getElementById('m_chk_new');
  if (!input || !input.value.trim()) return;
  modalChkItems.push({ text: input.value.trim(), done: false });
  input.value = '';
  renderModalChk();
}

function exportBackup() {
  const data = {
    exportDate: new Date().toISOString(),
    prospeccao: getCards('prospeccao'),
    conteudo: getCards('conteudo'),
    engenharia: getCards('engenharia'),
    pessoal: getCards('pessoal'),
    lancamentos,
  };
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'valboard-backup-' + today() + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
}

// ── INIT ──────────────────────────────────────────────────────────────
pagoAtivo = false;
renderHome();
</script>
