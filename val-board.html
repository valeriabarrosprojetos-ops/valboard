<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Val Board – Gestão de Trabalhos</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0F0E0C;
  --surface: #1A1916;
  --surface2: #222118;
  --surface3: #2A2820;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.12);
  --text: #F2EDE4;
  --text2: #9E9A92;
  --text3: #5E5B55;
  --gold: #C9A84C;
  --gold-dim: rgba(201,168,76,0.15);
  --gold-glow: rgba(201,168,76,0.08);
  --orange: #D4754A;
  --orange-dim: rgba(212,117,74,0.15);
  --blue: #5B8FA8;
  --blue-dim: rgba(91,143,168,0.15);
  --green: #6A9E78;
  --green-dim: rgba(106,158,120,0.15);
  --rose: #B87878;
  --rose-dim: rgba(184,120,120,0.15);
  --violet: #8B7AAD;
  --violet-dim: rgba(139,122,173,0.15);
  --red: #C05050;
  --red-dim: rgba(192,80,80,0.15);
}

body {
  font-family: 'Syne', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── HEADER ── */
header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 28px;
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(12px);
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-icon {
  width: 34px;
  height: 34px;
  background: var(--gold);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Cormorant Garamond', serif;
  font-size: 18px;
  font-weight: 700;
  color: #0F0E0C;
  flex-shrink: 0;
}

.brand-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 22px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: 0.3px;
}

.brand-handle {
  font-size: 11px;
  color: var(--text3);
  letter-spacing: 1.5px;
  text-transform: uppercase;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 10px;
}

.btn-primary {
  background: var(--gold);
  color: #0F0E0C;
  border: none;
  padding: 9px 18px;
  border-radius: 8px;
  font-family: 'Syne', sans-serif;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
  letter-spacing: 0.2px;
  white-space: nowrap;
}

.btn-primary:hover { background: #D4B460; transform: translateY(-1px); }

/* ── STATS ── */
.stats-row {
  display: flex;
  gap: 0;
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
  background: var(--surface);
}

.stat-item {
  padding: 14px 28px;
  border-right: 1px solid var(--border);
  min-width: 140px;
  flex-shrink: 0;
}

.stat-value {
  font-family: 'Cormorant Garamond', serif;
  font-size: 26px;
  font-weight: 700;
  color: var(--text);
  line-height: 1;
  margin-bottom: 3px;
}

.stat-value.gold { color: var(--gold); }
.stat-value.green { color: var(--green); }
.stat-value.orange { color: var(--orange); }

.stat-label {
  font-size: 10px;
  color: var(--text3);
  letter-spacing: 1.5px;
  text-transform: uppercase;
  font-weight: 600;
}

/* ── FILTER BAR ── */
.filter-bar {
  padding: 12px 28px;
  display: flex;
  gap: 6px;
  align-items: center;
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
  flex-wrap: wrap;
  background: var(--bg);
}

.filter-chip {
  padding: 5px 13px;
  border-radius: 20px;
  border: 1px solid var(--border2);
  background: var(--surface);
  font-family: 'Syne', sans-serif;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  color: var(--text2);
  transition: all 0.18s;
  white-space: nowrap;
  letter-spacing: 0.3px;
}

.filter-chip:hover, .filter-chip.active {
  border-color: var(--gold);
  color: var(--gold);
  background: var(--gold-dim);
}

.filter-chip.filter-due.active[data-due="overdue"] { border-color: var(--red); color: var(--red); background: var(--red-dim); }
.filter-chip.filter-due.active[data-due="today"] { border-color: var(--gold); color: var(--gold); background: var(--gold-dim); }
.filter-chip.filter-due.active[data-due="week"] { border-color: var(--blue); color: var(--blue); background: var(--blue-dim); }
.filter-chip.filter-due.active[data-due="nodue"] { border-color: var(--text3); color: var(--text2); background: var(--surface2); }
.filter-chip.filter-status.active { border-color: var(--violet); color: var(--violet); background: var(--violet-dim); }

.filter-chip.cat-conteudo.active { border-color: var(--orange); color: var(--orange); background: var(--orange-dim); }
.filter-chip.cat-engenharia.active { border-color: var(--blue); color: var(--blue); background: var(--blue-dim); }
.filter-chip.cat-prospeccao.active { border-color: var(--violet); color: var(--violet); background: var(--violet-dim); }
.filter-chip.cat-pessoal.active { border-color: var(--rose); color: var(--rose); background: var(--rose-dim); }

/* ── BOARD ── */
.board-wrap {
  padding: 24px 20px;
  overflow-x: auto;
  min-height: calc(100vh - 180px);
}

.board {
  display: flex;
  gap: 16px;
  align-items: flex-start;
  min-width: max-content;
}

/* ── COLUMNS ── */
.column {
  width: 290px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
}

.col-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 4px;
  margin-bottom: 10px;
}

.col-title-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
}

.col-bar {
  width: 3px;
  height: 18px;
  border-radius: 2px;
}

.col-name {
  font-size: 13px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: 0.3px;
}

.col-badge {
  background: var(--surface2);
  color: var(--text3);
  border-radius: 10px;
  padding: 2px 8px;
  font-size: 11px;
  font-weight: 600;
}

.col-body {
  background: var(--surface);
  border-radius: 14px;
  border: 1px solid var(--border);
  padding: 10px;
  min-height: 120px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  transition: border-color 0.2s, background 0.2s;
}

.col-body.drag-over {
  border-color: var(--gold);
  background: var(--gold-glow);
}

.col-add-btn {
  background: none;
  border: 1px dashed var(--border2);
  border-radius: 8px;
  padding: 8px 12px;
  width: 100%;
  cursor: pointer;
  font-family: 'Syne', sans-serif;
  font-size: 12px;
  color: var(--text3);
  transition: all 0.18s;
  text-align: left;
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 2px;
}

.col-add-btn:hover {
  border-color: var(--gold);
  color: var(--gold);
  background: var(--gold-glow);
}

.empty-state {
  padding: 24px 0;
  text-align: center;
  color: var(--text3);
  font-size: 12px;
  line-height: 2;
}

/* ── CARDS ── */
.card {
  background: var(--surface2);
  border-radius: 10px;
  border: 1px solid var(--border);
  padding: 13px 14px;
  cursor: grab;
  transition: all 0.18s;
  position: relative;
  user-select: none;
  border-left: 3px solid transparent;
}

.card:hover {
  border-color: var(--border2);
  background: var(--surface3);
  transform: translateY(-1px);
  box-shadow: 0 6px 20px rgba(0,0,0,0.35);
}

.card.dragging { opacity: 0.4; cursor: grabbing; }

.card.cat-conteudo { border-left-color: var(--orange); }
.card.cat-engenharia { border-left-color: var(--blue); }
.card.cat-prospeccao { border-left-color: var(--violet); }
.card.cat-pessoal { border-left-color: var(--rose); }

.card-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 6px;
}

.card-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  line-height: 1.45;
  flex: 1;
}

.card-menu {
  display: flex;
  gap: 2px;
  opacity: 0;
  transition: opacity 0.15s;
  flex-shrink: 0;
}

.card:hover .card-menu { opacity: 1; }

.card-btn {
  background: var(--surface3);
  border: none;
  cursor: pointer;
  padding: 4px 6px;
  border-radius: 5px;
  font-size: 12px;
  color: var(--text2);
  transition: all 0.15s;
  line-height: 1;
}

.card-btn:hover { background: var(--border2); color: var(--text); }

.card-desc {
  font-size: 11px;
  color: var(--text2);
  line-height: 1.55;
  margin-bottom: 10px;
}

.card-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-bottom: 8px;
}

.chip {
  padding: 2px 8px;
  border-radius: 8px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}

.chip-conteudo { background: var(--orange-dim); color: var(--orange); }
.chip-engenharia { background: var(--blue-dim); color: var(--blue); }
.chip-prospeccao { background: var(--violet-dim); color: var(--violet); }
.chip-pessoal { background: var(--rose-dim); color: var(--rose); }
.chip-publi { background: var(--green-dim); color: var(--green); }
.chip-ugc { background: var(--gold-dim); color: var(--gold); }
.status-badge { padding: 2px 9px; border-radius: 8px; font-size: 10px; font-weight: 700; letter-spacing: 0.5px; display:inline-flex; align-items:center; gap:3px; }
.status-em_negociacao { background: rgba(91,143,168,0.2); color: #7AB8D4; }
.status-proposta_enviada { background: rgba(201,168,76,0.2); color: #D4B460; }
.status-fechado { background: rgba(106,158,120,0.25); color: #88CC99; }
.status-perdido { background: rgba(192,80,80,0.2); color: #D47070; }
.status-sem_interesse { background: rgba(255,255,255,0.06); color: #888480; }
.chip-urgente { background: var(--red-dim); color: var(--red); }
.chip-art { background: var(--blue-dim); color: var(--blue); }
.chip-medicao { background: rgba(106,158,120,0.15); color: #6A9E78; }
.chip-inicial { background: rgba(139,122,173,0.15); color: #8B7AAD; }
.chip-executivo { background: rgba(201,168,76,0.15); color: var(--gold); }
.chip-roteiro { background: rgba(91,143,168,0.18); color: #7AB8D4; }
.chip-gravar { background: rgba(212,117,74,0.18); color: #E8956A; }
.chip-editar { background: rgba(139,122,173,0.18); color: #A994CC; }
.chip-aguard_produto { background: rgba(201,168,76,0.18); color: #D4B460; }
.chip-aguard_aprov { background: rgba(192,80,80,0.18); color: #D47070; }
.chip-revisao { background: rgba(184,120,120,0.18); color: #CC9090; }
.chip-a_receber { background: rgba(106,158,120,0.22); color: #88CC99; }
.chip-ideia { background: rgba(255,255,255,0.06); color: #888480; }
.chip-apresentacao { background: rgba(91,143,168,0.18); color: #7AB8D4; }
.chip-reuniao { background: rgba(106,158,120,0.22); color: #88CC99; }
.chip-em_cotacao { background: rgba(201,168,76,0.22); color: #D4B460; }
.chip-linkedin { background: rgba(91,143,168,0.22); color: #5B8FA8; }
.chip-falta_info { background: rgba(192,80,80,0.18); color: #D47070; border: 1px dashed #D47070; }
.notes-preview li:hover > span:first-child { border-color: var(--gold) !important; background: var(--gold-dim); }
/* coluna mercado */
.col-mercado-bar { background: #6A9E78; }

/* ── NOTES EDITOR ── */
.notes-tabs {
  display: flex;
  gap: 2px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 10px;
}

.notes-tab {
  padding: 6px 12px;
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  font-family: 'Syne', sans-serif;
  font-size: 11px;
  font-weight: 600;
  color: var(--text3);
  cursor: pointer;
  transition: all 0.15s;
  letter-spacing: 0.3px;
  margin-bottom: -1px;
}

.notes-tab.active { color: var(--gold); border-bottom-color: var(--gold); }
.notes-tab:hover { color: var(--text2); }

.notes-toolbar {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  margin-bottom: 8px;
  padding: 6px 8px;
  background: var(--surface3);
  border-radius: 8px 8px 0 0;
  border: 1px solid var(--border2);
  border-bottom: none;
}

.notes-tool-btn {
  background: none;
  border: none;
  color: var(--text2);
  padding: 4px 8px;
  border-radius: 5px;
  cursor: pointer;
  font-size: 12px;
  font-family: 'Syne', sans-serif;
  font-weight: 600;
  transition: all 0.15s;
  line-height: 1;
}

.notes-tool-btn:hover { background: var(--border2); color: var(--text); }
.notes-tool-btn.separator { color: var(--border2); cursor: default; padding: 4px 2px; }
.notes-tool-btn.separator:hover { background: none; color: var(--border2); }

.notes-area {
  width: 100%;
  min-height: 200px;
  max-height: 400px;
  padding: 12px 14px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 0 0 8px 8px;
  font-family: 'Syne', sans-serif;
  font-size: 13px;
  color: var(--text);
  outline: none;
  resize: vertical;
  line-height: 1.7;
  transition: border 0.18s;
}

.notes-area:focus { border-color: var(--gold); }

.notes-preview {
  min-height: 200px;
  max-height: 400px;
  overflow-y: auto;
  padding: 12px 14px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 8px;
  font-size: 13px;
  color: var(--text2);
  line-height: 1.8;
  display: none;
}

.notes-preview.active { display: block; }

.notes-preview h1, .notes-preview h2, .notes-preview h3 {
  color: var(--text);
  font-family: 'Cormorant Garamond', serif;
  margin: 12px 0 6px;
}
.notes-preview h1 { font-size: 20px; }
.notes-preview h2 { font-size: 17px; }
.notes-preview h3 { font-size: 14px; color: var(--gold); }
.notes-preview strong { color: var(--text); font-weight: 700; }
.notes-preview em { color: var(--accent-light, #E8A870); font-style: italic; }
.notes-preview ul, .notes-preview ol { padding-left: 18px; margin: 6px 0; }
.notes-preview li { margin-bottom: 3px; }
.notes-preview hr { border: none; border-top: 1px solid var(--border2); margin: 12px 0; }
.notes-preview a { color: var(--blue); text-decoration: underline; }
.notes-preview code {
  background: var(--surface3);
  padding: 1px 5px;
  border-radius: 4px;
  font-family: monospace;
  font-size: 12px;
  color: var(--gold);
}
.notes-preview blockquote {
  border-left: 3px solid var(--gold);
  padding-left: 12px;
  color: var(--text3);
  margin: 8px 0;
}

/* Card note indicator */
.card-has-notes {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-size: 10px;
  color: var(--text3);
  background: var(--surface3);
  padding: 2px 7px;
  border-radius: 6px;
  margin-top: 4px;
}
.chip-ugc { background: var(--gold-dim); color: var(--gold); }
.status-badge { padding: 2px 9px; border-radius: 8px; font-size: 10px; font-weight: 700; letter-spacing: 0.5px; display:inline-flex; align-items:center; gap:3px; }
.status-em_negociacao { background: rgba(91,143,168,0.2); color: #7AB8D4; }
.status-proposta_enviada { background: rgba(201,168,76,0.2); color: #D4B460; }
.status-fechado { background: rgba(106,158,120,0.25); color: #88CC99; }
.status-perdido { background: rgba(192,80,80,0.2); color: #D47070; }
.status-sem_interesse { background: rgba(255,255,255,0.06); color: #888480; }

.card-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
}

.card-due {
  font-size: 10px;
  color: var(--text3);
  display: flex;
  align-items: center;
  gap: 4px;
  font-weight: 600;
  letter-spacing: 0.3px;
}

.card-due.overdue { color: var(--red); }
.card-due.soon { color: var(--gold); }

.card-value {
  font-family: 'Cormorant Garamond', serif;
  font-size: 15px;
  font-weight: 700;
  color: var(--gold);
  letter-spacing: 0.3px;
}

.priority-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
}

.dot-high { background: var(--red); }
.dot-medium { background: var(--gold); }
.dot-low { background: var(--green); }

/* ── MODAL ── */
.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.75);
  z-index: 300;
  align-items: center;
  justify-content: center;
  padding: 20px;
  backdrop-filter: blur(4px);
}

.overlay.show { display: flex; }

.modal {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 18px;
  padding: 28px;
  width: 100%;
  max-width: 520px;
  max-height: 90vh;
  overflow-y: auto;
  animation: popIn 0.22s ease;
  box-shadow: 0 30px 80px rgba(0,0,0,0.6);
}

@keyframes popIn {
  from { opacity: 0; transform: scale(0.95) translateY(10px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

.modal-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 24px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 22px;
}

.form-group { margin-bottom: 14px; }

.form-label {
  display: block;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.8px;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: 6px;
}

.form-input,
.form-select,
.form-textarea {
  width: 100%;
  padding: 10px 14px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 9px;
  font-family: 'Syne', sans-serif;
  font-size: 13px;
  color: var(--text);
  outline: none;
  transition: border 0.18s;
  -webkit-appearance: none;
}

.form-input:focus,
.form-select:focus,
.form-textarea:focus {
  border-color: var(--gold);
}

.form-select option { background: var(--surface2); }
.form-textarea { resize: vertical; min-height: 70px; line-height: 1.5; }

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.form-row-3 {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 12px;
}

.currency-wrap { position: relative; }
.currency-symbol {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  font-family: 'Cormorant Garamond', serif;
  font-size: 15px;
  color: var(--gold);
  font-weight: 700;
  pointer-events: none;
}

.currency-wrap .form-input { padding-left: 28px; }

.modal-actions {
  display: flex;
  gap: 10px;
  justify-content: flex-end;
  margin-top: 22px;
}

.btn-cancel {
  padding: 9px 18px;
  border-radius: 8px;
  border: 1px solid var(--border2);
  background: none;
  font-family: 'Syne', sans-serif;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  color: var(--text2);
  transition: all 0.18s;
}

.btn-cancel:hover { background: var(--surface2); color: var(--text); }

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 3px; }

/* ── CONFIRM DELETE ── */
.confirm-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.75);
  z-index: 400;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.confirm-overlay.show { display: flex; }

.confirm-box {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 14px;
  padding: 24px 28px;
  width: 100%;
  max-width: 360px;
  text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  animation: popIn 0.18s ease;
}

.confirm-box h3 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 20px;
  color: var(--text);
  margin-bottom: 8px;
}

.confirm-box p {
  font-size: 13px;
  color: var(--text2);
  margin-bottom: 20px;
  line-height: 1.6;
}

.confirm-actions { display: flex; gap: 10px; justify-content: center; }

.btn-danger {
  padding: 9px 20px;
  border-radius: 8px;
  border: none;
  background: var(--red);
  color: white;
  font-family: 'Syne', sans-serif;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.18s;
}

.btn-danger:hover { filter: brightness(1.15); }

/* ── NAV TABS ── */
.nav-tabs {
  display: flex;
  gap: 2px;
  padding: 0 28px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}

.nav-tab {
  padding: 12px 20px;
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  font-family: 'Syne', sans-serif;
  font-size: 13px;
  font-weight: 600;
  color: var(--text3);
  cursor: pointer;
  transition: all 0.18s;
  letter-spacing: 0.3px;
  display: flex;
  align-items: center;
  gap: 7px;
}

.nav-tab:hover { color: var(--text2); }
.nav-tab.active { color: var(--gold); border-bottom-color: var(--gold); }

/* ── PAGE VIEWS ── */
.page { display: none; }
.page.active { display: block; }

/* ── HOME PAGE ── */
.home-wrap {
  padding: 24px 28px;
  max-width: 1400px;
  margin: 0 auto;
}

.home-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 16px;
}

@media (min-width: 768px) {
  .home-grid {
    grid-template-columns: 1fr 1fr;
    gap: 18px;
  }
  .home-agenda {
    grid-row: span 2;
  }
}

@media (min-width: 1100px) {
  .home-grid {
    grid-template-columns: 1fr 340px 340px;
  }
  .home-agenda {
    grid-row: span 2;
  }
}

/* ── HOME SECTIONS ── */
.home-section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
}

.home-section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px 12px;
  border-bottom: 1px solid var(--border);
}

.home-section-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 18px;
  font-weight: 700;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 8px;
}

.home-section-body { padding: 14px 16px; }

/* ── TODAY / TASKS SECTION ── */
.task-group { margin-bottom: 16px; }

.task-group-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.label-overdue { color: var(--red); }
.label-today { color: var(--gold); }
.label-soon { color: var(--blue); }

.task-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 9px 12px;
  background: var(--surface2);
  border-radius: 9px;
  margin-bottom: 6px;
  border-left: 3px solid transparent;
  cursor: pointer;
  transition: all 0.15s;
}

.task-item:hover { background: var(--surface3); }
.task-item.overdue { border-left-color: var(--red); }
.task-item.today { border-left-color: var(--gold); }
.task-item.soon { border-left-color: var(--blue); }

.task-check {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  border: 1.5px solid var(--border2);
  flex-shrink: 0;
  margin-top: 1px;
  cursor: pointer;
  transition: all 0.15s;
}

.task-check:hover { border-color: var(--gold); background: var(--gold-dim); }

.task-info { flex: 1; min-width: 0; }

.task-name {
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 2px;
}

.task-meta {
  font-size: 10px;
  color: var(--text3);
  display: flex;
  gap: 8px;
}

.task-due-badge {
  font-size: 10px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 6px;
  flex-shrink: 0;
}

.badge-overdue { background: var(--red-dim); color: var(--red); }
.badge-today { background: var(--gold-dim); color: var(--gold); }
.badge-soon { background: var(--blue-dim); color: var(--blue); }

.no-tasks {
  text-align: center;
  padding: 24px;
  color: var(--text3);
  font-size: 13px;
}

/* ── CALENDAR ── */
.calendar-wrap { padding: 14px 16px; }

.cal-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}

.cal-month {
  font-family: 'Cormorant Garamond', serif;
  font-size: 17px;
  font-weight: 700;
  color: var(--text);
}

.cal-nav-btn {
  background: var(--surface2);
  border: 1px solid var(--border2);
  color: var(--text2);
  width: 28px;
  height: 28px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  justify-content: center;
}

.cal-nav-btn:hover { background: var(--surface3); color: var(--text); }

.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 3px;
}

.cal-day-name {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text3);
  text-align: center;
  padding: 4px 0;
}

.cal-day {
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 6px;
  font-size: 12px;
  color: var(--text2);
  cursor: pointer;
  transition: all 0.15s;
  position: relative;
  font-weight: 500;
}

.cal-day:hover { background: var(--surface2); color: var(--text); }
.cal-day.other-month { color: var(--text3); opacity: 0.4; }
.cal-day.today { background: var(--gold); color: #0F0E0C; font-weight: 700; }
.cal-day.has-task::after {
  content: '';
  position: absolute;
  bottom: 3px;
  left: 50%;
  transform: translateX(-50%);
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--orange);
}
.cal-day.today.has-task::after { background: #0F0E0C; }
.cal-day.has-overdue::after { background: var(--red); }

/* ── FINANCIAL ── */
.fin-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 14px;
}

.fin-card {
  background: var(--surface2);
  border-radius: 10px;
  padding: 12px 14px;
  border: 1px solid var(--border);
}

.fin-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: 4px;
}

.fin-value {
  font-family: 'Cormorant Garamond', serif;
  font-size: 22px;
  font-weight: 700;
}

.fin-value.receivable { color: var(--gold); }
.fin-value.received { color: var(--green); }
.fin-value.engenharia { color: var(--blue); }
.fin-value.conteudo { color: var(--orange); }

.fin-breakdown {
  background: var(--surface2);
  border-radius: 10px;
  padding: 12px 14px;
  border: 1px solid var(--border);
}

.fin-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 0;
  border-bottom: 1px solid var(--border);
  font-size: 12px;
}

.fin-row:last-child { border-bottom: none; }
.fin-row-label { color: var(--text2); display: flex; align-items: center; gap: 6px; }
.fin-row-val { font-weight: 700; color: var(--text); font-family: 'Cormorant Garamond', serif; font-size: 14px; }

/* ── INFO / LOGINS ── */
.info-tabs {
  display: flex;
  gap: 4px;
  padding: 10px 16px 0;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}

.info-tab {
  padding: 6px 12px;
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  font-family: 'Syne', sans-serif;
  font-size: 11px;
  font-weight: 600;
  color: var(--text3);
  cursor: pointer;
  transition: all 0.15s;
  letter-spacing: 0.3px;
  margin-bottom: -1px;
}

.info-tab.active { color: var(--gold); border-bottom-color: var(--gold); }
.info-tab:hover { color: var(--text2); }

.info-panel { display: none; padding: 14px 16px; }
.info-panel.active { display: block; }

.info-item {
  background: var(--surface2);
  border-radius: 10px;
  padding: 12px 14px;
  margin-bottom: 8px;
  border: 1px solid var(--border);
  position: relative;
}

.info-item-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
}

.info-item-title {
  font-size: 12px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: 0.3px;
}

.info-item-body {
  font-size: 11px;
  color: var(--text2);
  line-height: 1.7;
  white-space: pre-wrap;
  word-break: break-all;
}

.info-copy-btn {
  background: var(--surface3);
  border: none;
  color: var(--text3);
  padding: 3px 8px;
  border-radius: 5px;
  font-size: 10px;
  cursor: pointer;
  transition: all 0.15s;
  font-family: 'Syne', sans-serif;
  font-weight: 600;
}

.info-copy-btn:hover { background: var(--border2); color: var(--text); }

.info-add-btn {
  width: 100%;
  padding: 9px;
  background: none;
  border: 1px dashed var(--border2);
  border-radius: 9px;
  color: var(--text3);
  font-family: 'Syne', sans-serif;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.info-add-btn:hover { border-color: var(--gold); color: var(--gold); background: var(--gold-glow); }

/* ── INFO MODAL ── */
.info-modal {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 18px;
  padding: 28px;
  width: 100%;
  max-width: 440px;
  box-shadow: 0 30px 80px rgba(0,0,0,0.6);
  animation: popIn 0.22s ease;
}

/* ── RESPONSIVE ── */
@media (max-width: 1100px) {
  .home-grid { grid-template-columns: 1fr 1fr; }
}
/* Mobile first */
.home-wrap { padding: 12px; }

@media (min-width: 768px) {
  .home-wrap { padding: 20px 24px; }
  .home-info { grid-column: 2 / 3; }
}

@media (min-width: 1100px) {
  .home-wrap { padding: 24px 28px; }
  .home-info { grid-column: 2 / 4; }
}

@media (max-width: 767px) {
  .nav-tab { padding: 10px 10px; font-size: 11px; gap: 4px; }
  .stats-row { flex-wrap: nowrap; overflow-x: auto; }
  .stat-item { min-width: 90px; padding: 10px 14px; }
  .stat-value { font-size: 20px; }
  .home-section-title { font-size: 15px; }
  .board-wrap { padding: 10px 6px; }
  .column { width: 250px; }
  .task-item { padding: 8px 10px; }
  .task-name { font-size: 12px; }
  .home-section-body { padding: 10px 12px; }
  .header { padding: 0 16px; }
  .brand-name { font-size: 18px; }
}
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="brand">
    <div class="brand-icon">V</div>
    <div>
      <div class="brand-name">Val Board</div>
      <div class="brand-handle">@val_barros</div>
    </div>
  </div>

  </div>
</header>

<!-- NAV TABS -->
<div class="nav-tabs">

  <button class="nav-tab" onclick="switchPage('kanban',this)">📋 Kanban</button>
  <button class="nav-tab" onclick="switchPage('financeiro',this)">💰 Financeiro</button>
</div>

<!-- HOME PAGE -->
<div id="page-home" class="page active">
  <div class="home-wrap">
    <div class="home-grid">

      <!-- AGENDA — ocupa coluna 1 inteira no desktop, full no mobile -->
      <div class="home-section home-agenda">
        <div class="home-section-head">
          <span class="home-section-title">📅 Agenda</span>
          <span id="todayLabel" style="font-size:11px;color:var(--text3);font-weight:600;letter-spacing:1px;"></span>
        </div>

      </div>

      <!-- CALENDÁRIO -->

          <span class="home-section-title">🗓 Calendário</span>
        </div>
        <div class="calendar-wrap" id="calWrap"></div>
      </div>

      <!-- FINANCEIRO -->
      <div class="home-section home-fin">
        <div class="home-section-head">
          <span class="home-section-title">💰 Financeiro</span>
          <button class="btn-primary" style="font-size:12px;padding:6px 14px;" onclick="switchPage('financeiro', document.querySelectorAll('.nav-tab')[2])">Ver tudo</button>
        </div>

      <!-- INFORMAÇÕES IMPORTANTES -->

        <div id="infoPanel-prospeccao" class="info-panel"></div>
      </div>

    </div>

</div>

<!-- KANBAN PAGE -->
<div id="page-kanban" class="page">

  <div class="filter-bar" style="flex-direction:column;align-items:flex-start;gap:8px;padding:12px 28px;">

      <span style="font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);margin-right:4px;">Área</span>
      <button class="filter-chip active" data-filter="all" onclick="setFilter('all',this)">Tudo</button>
      <button class="filter-chip cat-conteudo" data-filter="conteudo" onclick="setFilter('conteudo',this)">🎬 Conteúdo</button>
      <button class="filter-chip cat-engenharia" data-filter="engenharia" onclick="setFilter('engenharia',this)">📐 Engenharia</button>
      <button class="filter-chip cat-prospeccao" data-filter="prospeccao" onclick="setFilter('prospeccao',this)">📞 Prospecção</button>

      <button class="filter-chip filter-status" data-status="proposta_enviada" onclick="setStatusFilter('proposta_enviada',this)">📄 Proposta enviada</button>
      <button class="filter-chip filter-status" data-status="fechado" onclick="setStatusFilter('fechado',this)">✅ Fechado</button>
      <button class="filter-chip filter-status" data-status="perdido" onclick="setStatusFilter('perdido',this)">❌ Perdido</button>
      <button class="filter-chip filter-status" data-status="sem_interesse" onclick="setStatusFilter('sem_interesse',this)">🚫 Sem interesse</button>

<!-- MODAL NOVA/EDITAR TAREFA -->
<div class="overlay" id="overlay" onclick="overlayClick(event)">

    <div class="form-group">
      <label class="form-label">Título *</label>
      <input class="form-input" id="fTitle" type="text" placeholder="Nome do trabalho ou demanda..." />

      <div class="notes-tabs">
        <button class="notes-tab active" onclick="switchNoteTab('edit',this)">✏️ Editar</button>
        <button class="notes-tab" onclick="switchNoteTab('preview',this)">👁 Preview</button>
      </div>
      <div class="notes-toolbar">
        <button class="notes-tool-btn" onclick="notesInsert('**','**')" title="Negrito"><b>B</b></button>
        <button class="notes-tool-btn" onclick="notesInsert('*','*')" title="Itálico"><i>I</i></button>
        <button class="notes-tool-btn" onclick="notesInsert('### ','')" title="Título">H</button>
        <span class="notes-tool-btn separator">|</span>
        <button class="notes-tool-btn" onclick="notesInsertLine('- ')" title="Lista">≡</button>
        <button class="notes-tool-btn" onclick="notesInsertLine('1. ')" title="Lista numerada">1.</button>
        <button class="notes-tool-btn" onclick="notesInsertLine('- [ ] ')" title="Checklist">☑</button>
        <span class="notes-tool-btn separator">|</span>
        <button class="notes-tool-btn" onclick="notesInsert('`','`')" title="Código">{ }</button>
        <button class="notes-tool-btn" onclick="notesInsertLine('> ')" title="Citação">"</button>
        <button class="notes-tool-btn" onclick="notesInsertLine('---')" title="Divisor">—</button>
      </div>
      <textarea class="notes-area" id="fNotes" placeholder="Escreva aqui roteiros, briefings, checklist, links, observações...

Dicas de formatação:
**negrito**  *itálico*  ### título
- item de lista
- [ ] checklist
--- divisor"></textarea>
      <div class="notes-preview" id="notesPreview"></div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Área</label>
        <select class="form-select" id="fCat" onchange="updateTagSelect(this.value,'')">

          <option value="engenharia">📐 Engenharia</option>
          <option value="prospeccao">📞 Prospecção</option>

        <label class="form-label">Tipo</label>
        <select class="form-select" id="fTag"></select>
      </div>
    </div>

    <div class="form-row-3">

        <label class="form-label">Valor (R$)</label>
        <div class="currency-wrap">
          <span class="currency-symbol">R$</span>
          <input class="form-input" id="fValue" type="number" min="0" step="0.01" placeholder="0,00" />
        </div>
      </div>
      <div class="form-group" id="dueGroup">
        <label class="form-label" id="dueLabel">📅 Prazo / Entrega</label>
        <input class="form-input" id="fDue" type="date" />
      </div>

async function supaFetch(path, options = {}) {
  const res = await fetch(SUPA_URL + path, {
    ...options,
    headers: {
      'apikey': SUPA_KEY,
      'Authorization': 'Bearer ' + SUPA_KEY,
      'Content-Type': 'application/json',
      'Prefer': 'return=minimal',
      ...(options.headers || {}),
    }
  });
  if (options.method === 'GET' || !options.method) {
    try { return await res.json(); } catch(e) { return []; }
  }
  return res;
}

// Carregar cards do Supabase (merge com defaultCards)
async function loadCardsFromDB() {
  try {
    const saved = await supaFetch('/rest/v1/cards?select=*');
    if (!saved || !Array.isArray(saved) || saved.length === 0) {
      // Primeira vez: salvar todos os cards defaults no banco
      cards = defaultCards();
      await saveAllCardsToDB();
      render();
      renderHome();
      return;
    }
    // Merge: defaultCards como base + dados do banco por cima
    const base = defaultCards();
    const savedMap = {};
    saved.forEach(c => savedMap[c.card_id] = c);
    cards = base.map(c => {
      if (savedMap[c.id]) {
        const s = savedMap[c.id];
        return { ...c,
          col: s.col || c.col,
          due: s.due || c.due,
          payDate: s.pay_date || c.payDate,
          value: s.value !== null ? s.value : c.value,
          prio: s.prio || c.prio,
          tag: s.tag !== undefined ? s.tag : c.tag,
          status: s.status !== undefined ? s.status : c.status,
          notes: s.notes || c.notes,
          desc: s.description || c.desc,
          title: s.title || c.title,
        };
      }
      return c;
    });
    // Adicionar cards novos que estão no banco mas não no defaultCards
    const baseIds = new Set(base.map(c => c.id));
    saved.forEach(s => {
      if (!baseIds.has(s.card_id)) {
        cards.push({
          id: s.card_id, title: s.title, desc: s.desc || '',
          notes: s.notes || '', cat: s.cat, tag: s.tag || '',
          status: s.status || '', value: s.value || 0,
          due: s.due || '', payDate: s.pay_date || '',
          prio: s.prio || 'medium', col: s.col,
        });
      }
    });
    render();
    renderHome();
  } catch(e) {
    console.error('Erro ao carregar do Supabase:', e);
    cards = defaultCards();
    render();
    renderHome();
  }
}

async function saveAllCardsToDB() {
  const rows = cards.map(c => ({
    card_id: c.id, title: c.title, description: c.desc || '',
    notes: c.notes || '', cat: c.cat, tag: c.tag || '',
    status: c.status || '', value: c.value || 0,
    due: c.due || null, pay_date: c.payDate || null,
    prio: c.prio || 'medium', col: c.col,
  }));
  // Upsert em lotes de 50
  for (let i = 0; i < rows.length; i += 50) {
    const batch = rows.slice(i, i + 50);
    await supaFetch('/rest/v1/cards', {
      method: 'POST',
      headers: { 'Prefer': 'resolution=merge-duplicates,return=minimal' },
      body: JSON.stringify(batch),
    });
  }
}

    {id:uid(),title:"COCA COLA -  Retornavel",desc:"[INSTAGRAM] CENA 1 — GANCHO (0–3s) 📸 Cena: Você na cozinha, ingredientes na bancada ou geladeira aberta. A Coca-Cola Retornável 2L a",cat:"conteudo",tag:"gravar",value:0,due:"2026-05-14",prio:"high",col:"doing",notes:"### CENA 1 \u2014 GANCHO (0\u20133s)\n\n**\ud83d\udcf8 Cena:** Voc\u00ea na cozinha, ingredientes na bancada ou geladeira aberta. A Coca-Cola Retorn\u00e1vel 2L aparece em cena, fechada, com a tampa verde vis\u00edvel.\n\n**\ud83c\udf99 Fala:** _\"Hoje eu t\u00f4 no modo refei\u00e7\u00e3o r\u00e1pida \u2014 sem enrola\u00e7\u00e3o e sem gastar mais do que precisa.\"_\n\n**\ud83d\udcdd Texto na tela:** `Rotina corrida = escolhas inteligentes`\n\n> \u270f\ufe0f _Mudan\u00e7a: retirei o \"tem dia que\" \u2014 come\u00e7a com mais energia, prende mais no gancho._\n\n---\n\n### \ud83c\udfa5 CENA 2 \u2014 PREPARO DA REFEI\u00c7\u00c3O\n\n**\ud83d\udcf8 Cena:** Cortes r\u00e1pidos e naturais do preparo \u2014 mexendo panela, montando prato, close na comida.\n\n**\ud83c\udf99 Fala:** _\"Coisa simples, gostosa, que d\u00e1 pra fazer em minutos. E enquanto isso, fui juntando umas escolhas que t\u00e3o facilitando muito minha rotina.\"_\n\n> \u270f\ufe0f _Mudan\u00e7a: a fala original (\"aprendi que pequenas escolhas...\") soava um pouco gen\u00e9rica. Essa vers\u00e3o conecta organicamente com o que vem a seguir._\n\n---\n\n### \ud83c\udfa5 CENA 3 \u2014 ENTRADA NATURAL DO PRODUTO\n\n**\ud83d\udcf8 Cena:** Voc\u00ea pega a Coca-Cola Retorn\u00e1vel 2L da geladeira. R\u00f3tulo virado pra c\u00e2mera, nome vis\u00edvel, garrafa PET original, tampa verde aparecendo.\n\n**\ud83c\udf99 Fala:** _\"Uma delas foi a Coca-Cola Retorn\u00e1vel. Que entrou na minha rotina de um jeito que fez muito sentido.\"_\n\n> \u270f\ufe0f _Tom mais org\u00e2nico \u2014 n\u00e3o parece que o produto \"entrou no roteiro\", parece que ele j\u00e1 fazia parte._\n\n---\n\n### \ud83c\udfa5 CENA 4 \u2014 EXPLICA\u00c7\u00c3O DA DIN\u00c2MICA\n\n**\ud83d\udcf8 Cena:** Voc\u00ea montando a mesa, garrafa em cena. Um gesto natural mostrando a troca, ou take r\u00e1pido com garrafa vazia ao lado da cheia.\n\n**\ud83c\udf99 Fala:** _\"A din\u00e2mica \u00e9 assim: voc\u00ea leva a garrafa vazia no mercado, escolhe outra Coca-Cola Retorn\u00e1vel e paga s\u00f3 pelo l\u00edquido. Sem complica\u00e7\u00e3o.\"_\n\n**\ud83d\udcdd Texto na tela:** `Leva a garrafa vazia \u2192 paga s\u00f3 pelo l\u00edquido \ud83d\udca1`\n\n> \u270f\ufe0f _Mantive a explica\u00e7\u00e3o exata da din\u00e2mica conforme o briefing, mas com \"sem complica\u00e7\u00e3o\" no final pra fechar com o tom da campanha._\n\n---\n\n### \ud83c\udfa5 CENA 5 \u2014 CONSUMO\n\n**\ud83d\udcf8 Cena:** Abrindo a Coca-Cola Retorn\u00e1vel 2L, servindo em copo **transparente com gelo** _(sem ta\u00e7a, americano ou tulipa)_. Close no l\u00edquido sendo servido.\n\n**\ud83c\udfa7 Som:** ASMR do g\u00e1s + gelo\n\n**\ud83c\udf99 Fala:** _\"\u00c9 uma escolha que \u00e9 pr\u00e1tica, econ\u00f4mica \u2014 e ainda combina perfeitamente com o momento da refei\u00e7\u00e3o.\"_\n\n---\n\n### \ud83c\udfa5 CENA 6 \u2014 MOMENTO REAL\n\n**\ud83d\udcf8 Cena:** Voc\u00ea sentada comendo, de forma leve e natural. Nada posado, parece rotina de verdade.\n\n**\ud83c\udf99 Fala:** _\"\u00c9 exatamente esse tipo de escolha simples que deixa o dia mais f\u00e1cil \u2014 sem abrir m\u00e3o do momento gostoso.\"_\n\n---\n\n### \ud83c\udfa5 CENA 7 \u2014 CTA FINAL\n\n**\ud83d\udcf8 Cena:** Voc\u00ea segurando o copo, sorrindo naturalmente pra c\u00e2mera.\n\n**\ud83c\udf99 Fala:** _\"Se voc\u00ea ainda n\u00e3o conhece a Coca-Cola Retorn\u00e1vel, vale muito a pena descobrir essa din\u00e2mica.\"_\n\n**\ud83d\udcdd Texto na tela:** `#publi #VaiDeRetorn\u00e1vel`"},
    {id:uid(),title:"BATOM SACE LADY",desc:"VÍDEO 1 — “ISSO NÃO É SÓ UM BATOM” 🎬 GANCHO VISUAL Você passa o produto na boca… e depois mostra ele deslizando na mão i",cat:"conteudo",tag:"gravar",value:0,due:"",prio:"medium",col:"doing",notes:"# V\u00cdDEO 1 \u2014 \u201cISSO N\u00c3O \u00c9 S\u00d3 UM BATOM\u201d\n\n### \ud83c\udfac GANCHO VISUAL\n\nVoc\u00ea passa o produto na boca\u2026\ne depois mostra ele deslizando na m\u00e3o igual balm/skincare.\n\n### \ud83d\udde3 FALA\n\n\u201cEu achei que isso aqui era s\u00f3 um batom\u2026 at\u00e9 perceber que minha boca n\u00e3o ficou seca nem depois de horas.\u201d\n\n### \ud83d\ude2c PROBLEMA\n\nMostra:\n\n- boca craquelada\n- batom acumulando\n- linhas secas\n\n### \u2728 SOLU\u00c7\u00c3O\n\nClose:\n\n- textura cremosa\n- brilho confort\u00e1vel\n- aplica\u00e7\u00e3o f\u00e1cil\n\n### \ud83c\udf81 BENEF\u00cdCIO\n\n\u201c\u00c9 literalmente lip balm + batom ao mesmo tempo.\u201d\n\n### \ud83d\udce3 CTA\n\n\u201cAgora eu entendo porque isso viralizou.\u201d\n\n---\n\n# V\u00cdDEO 2 \u2014 \u201cTESTE DO CALOR\u201d\n\n### \ud83c\udfac GANCHO VISUAL\n\nVoc\u00ea deixa o produto no sol/carro/mesa quente.\n\nLegenda:\n\u201cDisseram que ele n\u00e3o derrete\u2026\u201d\n\n### \ud83d\udde3 FALA\n\n\u201cEu DUVIDEI.\u201d\n\n### \ud83c\udfa5 DESENVOLVIMENTO\n\nMostra:\n\n- clima quente\n- produto intacto\n- aplica\u00e7\u00e3o normal\n\n### \u2728 VIRADA\n\n\u201cComo isso continua cremoso sem virar uma meleca?\u201d\n\n### \ud83c\udf81 BENEF\u00cdCIO\n\nMostra:\n\n- acabamento bonito\n- textura firme\n- aplica\u00e7\u00e3o uniforme\n\n### \ud83d\udce3 CTA\n\n\u201cFinalmente um produto que sobrevive ao calor sem destruir a make.\u201d\n\n---\n\n# V\u00cdDEO 3 \u2014 \u201c3 SEGUNDOS PRA FICAR ARRUMADA\u201d\n\n### \ud83c\udfac GANCHO VISUAL\n\nVoc\u00ea atrasada:\n\n- bolsa aberta\n- cabelo bagun\u00e7ado\n- correria\n\n### \ud83d\udde3 FALA\n\n\u201cEu n\u00e3o tenho paci\u00eancia pra maquiagem complicada.\u201d\n\n### \ud83d\ude2c PROBLEMA\n\nMostra v\u00e1rios produtos espalhados.\n\n### \u2728 SOLU\u00c7\u00c3O\n\nVoc\u00ea pega S\u00d3 o Sace Lady.\n\nAplica:\n\n- sem espelho\n- r\u00e1pido\n- dentro do carro/elevador\n\n### \ud83c\udf81 BENEF\u00cdCIO\n\n\u201cParece que eu me esforcei\u2026 e eu literalmente levei 10 segundos.\u201d\n\n### \ud83d\udce3 CTA\n\n\u201cEsse virou meu produto de bolsa.\u201d\n\n---\n\n# V\u00cdDEO 4 \u2014 \u201cEFEITO BOCA SAUD\u00c1VEL\u201d\n\n### \ud83c\udfac GANCHO VISUAL\n\nClose EXTREMO da boca antes.\n\nBoca:\n\n- seca\n- sem cor\n- opaca\n\n### \u2728 TRANSI\u00c7\u00c3O\n\nAplica\u00e7\u00e3o em slow motion.\n\n### \ud83d\udde3 FALA\n\n\u201cEsse efeito de boca hidratada t\u00e1 me deixando viciada.\u201d\n\n### \ud83c\udf81 BENEF\u00cdCIO\n\nFoca MUITO em:\n\n- brilho natural\n- hidrata\u00e7\u00e3o\n- conforto\n\n### \ud83c\udfa5 PROVA VISUAL\n\nAperta os l\u00e1bios.\nMostra que:\n\n- n\u00e3o craquelou\n- n\u00e3o acumulou\n\n### \ud83d\udce3 CTA\n\n\u201cParece maquiagem rica.\u201d\n\n---\n\n# V\u00cdDEO 5 \u2014 \u201cO REFIL ME PEGOU\u201d\n\n### \ud83c\udfac GANCHO VISUAL\n\nClose trocando o refil.\n\n(Esse \u00e9 MUITO bom visualmente.)\n\n### \ud83d\udde3 FALA\n\n\u201cPera\u2026 ent\u00e3o eu N\u00c3O preciso comprar outro batom inteiro?\u201d\n\n### \ud83d\ude2e QUEBRA DE EXPECTATIVA\n\nMostra:\n\n- encaixe\n- troca\n- mecanismo girat\u00f3rio\n\n### \ud83c\udf81 BENEF\u00cdCIO\n\n\u201cAl\u00e9m de lindo, ainda evita desperd\u00edcio.\u201d\n\n### \ud83c\udfa5 DETALHES\n\nClose ASMR:\n\n- clique\n- encaixe\n- giro\n\n### \ud83d\udce3 CTA\n\n\u201cIsso aqui \u00e9 muito inteligente.\u201d\n\n---\n\n# GANCHOS EXTRAS PRA TESTAR\n\n- \u201cIsso aqui deixou minha boca bonita SEM parecer maquiagem pesada.\u201d\n- \u201cAchei que era s\u00f3 embalagem bonita\u2026\u201d\n- \u201cO brilho disso parece produto caro.\u201d\n- \u201cFinalmente um batom confort\u00e1vel.\u201d\n- \u201cMinha boca normalmente fica toda craquelada\u2026 menos com esse.\u201d\n- \u201cIsso aqui parece skincare disfar\u00e7ado de maquiagem.\u201d\n\n---\n\n# GANCHOS VISUAIS QUE PODEM VIRALIZAR\n\n### \ud83c\udfa5 TESTA:\n\n- aplicar sem espelho\n- close da textura\n- produto derretendo lentamente\n- ASMR da tampa\n- boca antes/depois\n- c\u00e2mera MUITO pr\u00f3xima\n- aplica\u00e7\u00e3o dentro do carro\n- tela verde mostrando gringa usando\n- jogar v\u00e1rios batons antigos na mesa e ficar s\u00f3 com ele\n- mostrar a bolsa cheia \u2192 depois s\u00f3 ele\n\n---\n\n# O QUE MAIS VAI VENDER NESSE PRODUTO\n\n\u2705 sensa\u00e7\u00e3o confort\u00e1vel\n\u2705 praticidade real\n\u2705 boca saud\u00e1vel\n\u2705 visual clean girl\n\u2705 glow natural\n\u2705 produto \u201cchique\u201d\n\u2705 mecanismo diferente\n\u2705 hidrata\u00e7\u00e3o real\n\nSe quiser, eu tamb\u00e9m posso fazer:\n\n- vers\u00f5es MAIS VIRAIS estilo TikTok\n- vers\u00f5es premium/cinematogr\u00e1ficas\n- vers\u00f5es UGC org\u00e2nicas\n- vers\u00f5es ADS de convers\u00e3o\n- roteiro completo cena por cena dos 5 v\u00eddeos\n- ideias de grava\u00e7\u00e3o e edi\u00e7\u00e3o pra cada um."},
    {id:uid(),title:"APICE COSMETICOS - Box 1",desc:"GANCHOS PRA STORIES (com cabelo solto) 1. “Meu cabelo tava BONITO… até eu descobrir isso aqui.” 👉 Já começa balançando o",cat:"conteudo",tag:"gravar",value:0,due:"",prio:"medium",col:"doing",notes:"GANCHOS PRA STORIES (com cabelo solto)\n\n1. \u201cMeu cabelo tava BONITO\u2026 at\u00e9 eu descobrir isso aqui.\u201d\n   \ud83d\udc49 J\u00e1 come\u00e7a balan\u00e7ando o cabelo.\n2. \u201cO brilho disso aqui n\u00e3o \u00e9 normal.\u201d\n   \ud83d\udc49 Luz batendo + close.\n3. \u201cParece cabelo de sal\u00e3o, mas foi em casa.\u201d\n   \ud83d\udc49 Passa a m\u00e3o lentamente no comprimento.\n4. \u201cIsso aqui deixa meu cabelo com cara de rico.\u201d\n   \ud83d\udc49 \u00d3TIMO pra \u00f3leo/spray/m\u00e1scara.\n5. \u201cEu nunca recebi tanto elogio no meu cabelo.\u201d\n   \ud83d\udc49 Faz cara de quem t\u00e1 lembrando.\n6. \u201cO toque desse cabelo depois disso aqui\u2026\u201d\n   \ud83d\udc49 Aproxima a c\u00e2mera enquanto passa os dedos.\n7. \u201cMeu cabelo seco tava implorando por isso.\u201d\n   \ud83d\udc49 Excelente pra hidrata\u00e7\u00e3o.\n8. \u201cSe teu cabelo t\u00e1 opaco, presta aten\u00e7\u00e3o nisso.\u201d\n   \ud83d\udc49 Gancho muito forte pra reten\u00e7\u00e3o.\n9. \u201cEsse produto faz meu cabelo refletir luz.\u201d\n   \ud83d\udc49 Flash ou janela ajudando.\n10. \u201cO dia que eu parei de usar isso, meu cabelo sentiu.\u201d\n    \ud83d\udc49 Cara de drama + humor leve.\n\n\ud83c\udfa5 B-ROLLS QUE FICAM LINDOS COM CABELO SOLTO\n\n\u2728 MOVIMENTO + SENSORIAL = v\u00eddeo premium\n\n- Slow motion jogando o cabelo pra tr\u00e1s\n- Passando os dedos entre os fios\n- Close nas pontas brilhando\n- Movimento lateral do cabelo na luz\n- Filmar atr\u00e1s mostrando comprimento\n- Cabelo passando na frente da c\u00e2mera\n- Close da textura dos fios\n- Aplicando \u00f3leo nas pontas\n- Apertando os fios mostrando maciez\n- Ventilador batendo no cabelo\n- Movimento de virar o rosto lentamente\n- Cabelo escorrendo nas costas\n- Close do brilho com flash\n- Abrindo o produto + textura\n- Pegando produto e espalhando na m\u00e3o\n- Aplica\u00e7\u00e3o no comprimento em c\u00e2mera lenta\n- Passando pente largo devagar\n- Cabelo deslizando pela m\u00e3o\n- Filmagem no espelho mexendo no cabelo\n- Close no \u201cantes opaco / depois brilhoso\u201d\n\n\ud83d\udd25 GANCHOS VISUAIS FORTES PRA HAIRCARE\n\n- Come\u00e7ar com o cabelo MUITO armado e seco\n- Zoom extremo nas pontas ressecadas\n- Mostrar brilho no sol logo no primeiro frame\n- Passar a m\u00e3o e o cabelo \u201cescorrer\u201d\n- Comparar um lado com produto e outro sem\n- Cabelo voando no ventilador\n- Come\u00e7ar com legenda:\n\n\n\u201cMeu cabelo nunca ficou assim sozinho.\u201d\n\n- Mostrar escova travando no cabelo \u2192 corte \u2192 deslizando\n- Aplicar \u00f3leo exageradamente pra gerar curiosidade\n- Come\u00e7ar olhando o cabelo no espelho com choque\n\n\ud83c\udfac CENAS QUE D\u00c3O CARA DE PUBLI CHIQUE\n\n- Janela com luz natural\n- Fundo branco ou neutro\n- Roupa clara/preta pra destacar o cabelo\n- Gravar no corredor/elevador\n- Cabelo contra a luz do sol\n- Espelho grande\n- Len\u00e7ol branco + cabelo espalhado\n- Close cinematic no comprimento"},
    {id:uid(),title:"YESSTYLE",desc:"🎬 CENA 1 – GANCHO (CURIOSIDADE + TENDÊNCIA) 📸 Visual: Você segurando o produto + expressão curiosa 🎙 Fala: “Eu tava OBCE",cat:"conteudo",tag:"gravar",value:0,due:"",prio:"medium",col:"doing",notes:"## **\ud83c\udfac CENA 1 \u2013 GANCHO (CURIOSIDADE + TEND\u00caNCIA)**\n\n**\ud83d\udcf8 Visual:**\n**Voc\u00ea segurando o produto + express\u00e3o curiosa**\n\n**\ud83c\udf99 Fala:**\n**\u201cEu tava OBCECADA pra testar skincare coreano\u2026 mas principalmente isso aqui\u2026\u201d**\n\n**\ud83d\udc49 (mostra o produto)**\n\n**\u201cretinal.\u201d**\n\n---\n\n## **\ud83c\udfac CENA 2 \u2013 QUEBRA DE EXPECTATIVA**\n\n**\ud83d\udcf8 Visual:**\n**Close no rosto**\n\n**\ud83c\udf99 Fala:**\n**\u201cPorque ningu\u00e9m fala tanto dele quanto do retinol\u2026 mas ele \u00e9 tipo a vers\u00e3o mais potente.\u201d**\n\n**\ud83d\udc49 (olhar de \u201cdescobri algo\u201d)**\n\n---\n\n## **\ud83c\udfac CENA 3 \u2013 PROBLEMA (CONEX\u00c3O)**\n\n**\ud83d\udcf8 Visual:**\n**Close nas linhas finas**\n\n**\ud83c\udf99 Fala:**\n**\u201cMinha pele come\u00e7ou a mudar\u2026 principalmente aqui nos olhos, com linhas finas e textura.\u201d**\n\n---\n\n## **\ud83c\udfac CENA 4 \u2013 EDUCA\u00c7\u00c3O R\u00c1PIDA (VALOR REAL)**\n\n**\ud83d\udcf8 Visual:**\n**Aplicando o produto / textura**\n\n**\ud83c\udf99 Fala:**\n**\u201cO retinal ajuda na renova\u00e7\u00e3o da pele, melhora textura, deixa mais uniforme\u2026 e d\u00e1 aquele aspecto de pele mais firme e iluminada.\u201d**\n\n---\n\n## **\ud83c\udfac CENA 5 \u2013 ROTINA (PRODUTOS)**\n\n### **\ud83e\uddf4 SERUM (BASE)**\n\n**\ud83d\udcf8 Visual:**\n**Aplicando**\n\n**\ud83c\udf99 Fala:**\n**\u201cEu come\u00e7o com o serum, que hidrata e j\u00e1 deixa a pele com glow\u2026\u201d**\n\n---\n\n### **\ud83d\udc89 ADVANCED SHOT (RETINAL)**\n\n**\ud83d\udcf8 Visual:**\n**Close + aplica\u00e7\u00e3o**\n\n**\ud83c\udf99 Fala:**\n**\u201cE esse aqui \u00e9 o mais interessante\u2026 al\u00e9m do retinal, oc\u00ea tomando / rea\u00e7\u00e3o real\n\n\ud83d\udde3\ufe0f\n\u201cE o gosto? S\u00e9rio\u2026 parece uma limonada rosinha, bem leve. N\u00e3o \u00e9 enjoativo.\u201d\n\n---\n\n### \ud83c\udfa5 CENA 7 (45\u201351s) \u2014 CTA NATURAL\n\n\ud83e\udd64 Voc\u00ea segurando o copo / vibe leve\n\n\ud83d\udde3\ufe0f\n\u201cVou testar esses dias e depois conto tudo\u2026 mas se voc\u00ea sofre na TPM igual eu, acho que vale conhecer.\u201d"},

    {id:uid(),title:"TUFF CHA BRANCO",desc:"Roteiro Enviado ROTEIRO UGC Linha Tuff Chá Branco | Perfumes Inspirados por Provanza ",cat:"conteudo",tag:"publi",value:0,due:"2026-03-05",prio:"medium",col:"done",notes:"Roteiro Enviado\n\nROTEIRO UGC\nLinha Tuff Ch\u00e1 Branco | Perfumes Inspirados por Provanza\n________________________________________\nCENA: Abro o arm\u00e1rio. Movimento as roupas. Close no meu rosto sentindo o cheiro.\nFALA: Tem cheiro que n\u00e3o \u00e9 s\u00f3 cheiro, \u00e9 sensa\u00e7\u00e3o de casa em ordem.\n________________________________________\nCENA: Chegando com o cesto de roupas para lavar e o amaciante junto dentro do cesto.\nColocando as roupas na m\u00e1quina.\nFALA: Eu lavo roupa praticamente todos os dias. E pra mim, lavanderia n\u00e3o \u00e9 s\u00f3 tarefa, \u00e9 cuidado.\n________________________________________\nCENA: Cheirando uma pe\u00e7a antiga, express\u00e3o neutra. (Na edi\u00e7\u00e3o vou colocar um filtro para dar a sensa\u00e7\u00e3o de ser uma mem\u00f3ria)\nFALA: Eu j\u00e1 usei produto que at\u00e9 limpava, mas o perfume sumia r\u00e1pido demais.\nE eu queria aquele cheiro elegante que fica.\n________________________________________\nCENA: Close no Lava-roupas Tuff Ch\u00e1 Branco, em cima da bancada.\nDespejando na tampa.\nPegando o amaciante dentro do cesto.\nClose no Amaciante Concentrado Tuff Ch\u00e1 Branco.\nFALA: Foi a\u00ed que eu conheci a nova Linha Tuff Perfumes Inspirados por Provanza, com a fragr\u00e2ncia best-seller Ch\u00e1 Branco.\u201d\n________________________________________\nCENA: Colocando o lava-roupas na m\u00e1quina. Depois o amaciante no compartimento.\nClose na textura. Close na m\u00e1quina girando.\nFALA: O Lava-Roupas Tuff Ch\u00e1 Branco limpa com alta performance e o Amaciante Concentrado Tuff Ch\u00e1 Branco deixa uma maciez intensa com esse perfume suave de ch\u00e1 branco.\n________________________________________\nCENA: Pendurando roupas.\nPassando a m\u00e3o no tecido.\nFALA: \ hampoo nos cachos. Espuma suave.\nDepois m\u00e1scara, enluvando com calma.\n\n**Voz mais suave:**\n\u201cA linha Eu Tenho a For\u00e7a n\u00e3o \u00e9 s\u00f3 sobre cabelo.\u201d\n\n\u201c\u00c9 sobre reconstru\u00e7\u00e3o.\u201d\n\n\u201c\u00c9 sobre lembrar que eu posso cair\u2026\nmas eu levanto.\u201d\n\n---\n\n## \ud83c\udf81 B \u2013 BENEF\u00cdCIOS (sensorial + emocional)\n\n**Cena:**\nAplicando t\u00f4nico na raiz.\nBruma finalizando.\n\nClose no movimento dos cachos.\n\n**Fala:**\n\u201cEla fortalece meus fios, devolve resist\u00eancia\u2026\nmas principalmente, me devolve esse momento.\u201d\n\n\u201cMeu.\u201d\n\n---\n\n## \ud83c\udfa5 P \u2013 PROVA / RESULTADO\n\n**Cena:**\nCabelo seco, volumoso, natural.\nVoc\u00ea sorrindo com sua beb\u00ea no colo.\n\n**Fala:**\n\u201cSer forte n\u00e3o \u00e9 n\u00e3o cair.\u201d\n\n\u201c\u00c9 levantar todos os dias.\u201d\n\n\u201cE lembrar\u2026\u201d\n\n(pausa, olhando direto)\n\n\u201cEu tenho a for\u00e7a.\u201d\n\n---\n\n## \ud83d\udce3 C \u2013 CTA (natural, n\u00e3o comercial)\n\n**Cena:**\nProdutos organizados ao lado.\nVoc\u00ea passando a m\u00e3o no cabelo.\n\n**Fala:**\n\u201cNesse Dia da Mulher, celebra sua hist\u00f3ria.\nSeu recome\u00e7o.\nSua textura.\u201d\n\n\u201cUse a linha Eu Tenho a For\u00e7a da Both\u00e2nico e mostre sua for\u00e7a neste 8 de mar\u00e7o!\u201d"},

ma da mesa.\nVai tirando as garrafas e alinhando ali mesmo.\n\n**FALA:**\n\u201cMeu combo da Bewow chegou e eu t\u00f4 obcecada\u2026\nolha a quantidade de sabores!\u201d\n\n---\n\n### \ud83d\udc40 CENA 3 \u2014 CONTEXTO REAL (10\u201316s)\n\n**A\u00c7\u00c3O:**\nVoc\u00ea se apoia na mesa, pega uma garrafa.\n\n**FALA:**\n\u201cEu tava muito cansada de sair do treino e n\u00e3o ter uma bebida gostosa\nque n\u00e3o fosse cheia de a\u00e7\u00facar ou coisa artificial.\u201d\n\n---\n\n### \ud83e\udee7 CENA 4 \u2014 ABRINDO A GARRAFA (16\u201322s)\n\n**A\u00c7\u00c3O:**\nAbre a garrafa em cima da mesa, perto da c\u00e2mera.\nDeixa o som da efervesc\u00eancia rolar.\n\n**FALA:**\n\u201cEscuta isso\u2026 \u00e9 fermenta\u00e7\u00e3o natural, n\u00e3o \u00e9 g\u00e1s fake.\u201d\n\n---\n\n### \ud83d\ude0b CENA 5 \u2014 DEGUSTA\u00c7\u00c3O (22\u201327s)\n\n**A\u00c7\u00c3O:**\nVoc\u00ea bebe apoiada na mesa.\nRea\u00e7\u00e3o espont\u00e2nea, sem exagero.\n\n**FALA:**\n\u201c\u00c9 gostosa de verdade.\nParece refrigerante, mas tem **15 calorias, zero a\u00e7\u00facar** e ainda tem probi\u00f3ticos.\u201d\n\n---\n\n### \ud83d\udcad CENA 6 \u2014 POSICIONAMENTO EMOCIONAL (27\u201332s)\n\n**A\u00c7\u00c3O:**\nVoc\u00ea deixa a garrafa na mesa, relaxa os ombros.\n\n**FALA:**\n\u201cVirou meu p\u00f3s-treino oficial.\nN\u00e3o abro m\u00e3o do sabor, mas cuido da minha sa\u00fade.\u201d\n\n---\n\n### \ud83d\udc49 CENA 7 \u2014 CTA (32\u201336s)\n\n**A\u00c7\u00c3O:**\nOlha direto pra c\u00e2mera, segura a garrafa.\n\n**FALA:**\n\u201cSe voc\u00ea tamb\u00e9m quer largar o refri, testa a Bewow.\nUsa o cupom **BEWOW10** e monta seu combo.\u201d\n\n---\n\n## \ud83d\udd25 AJUSTES QUE FAZEM ESSE V\u00cdDEO VENDER MAIS\n\n- **Bolsa de academia ou t\u00eanis aparecendo** = contexto imediato\n- Mesa organizada, mas **n\u00e3o perfeita demais**\n- Fala com leve cansa\u00e7o bom de p\u00f3s-treino (humaniza)\n- Grave **2 sabores diferentes** \u2192 rende varia\u00e7\u00e3o pra Ads\n\nSe voc\u00ea quiser, eu posso:\n\n- Criar **3 hooks diferentes s\u00f3 pra Ads**\n- Ajustar esse mesmo roteiro pra **25s mais agressivo**\n- Ou montar a vers\u00e3o **\u201cgeladeira cheia de Bewow\u201d** pra segunda entrega\n\n\ud83d\udc49 Qual sabor voc\u00ea pretende abrir no v\u00eddeo? Isso muda levemente a rea\u00e7\u00e3o e deixa ainda mais real.\n### TAKES PARA GRAVA\u00c7\u00c3O\n- [x] 1. Chegando com o tapete de yoga\n- [x] 2. \u00daltima postura de yoga (respira\u00e7\u00e3o, calma)\n- [x] 3. Sentando no tapete, pernas cruzadas4. Close no rosto respirando fundo (olhos fechando 1s)\n- [x] 5. Plano geral: tapete + piscina ao fundo\n- [x] 6. Garrafa da Bewow em p\u00e9 ao lado do tapete\n- [x] 7. Close na garrafa com gotinhas de \u00e1gua\n- [x] 8. Close no r\u00f3tulo \u201cAbacaxi com Hortel\u00e3\u201d\n- [x] 9. Garrafa na m\u00e3o, sem beber (est\u00e1tico)\n- [x] 10. Close abrindo a garrafa (som do g\u00e1s)\n- [x] 11. Abrindo a garrafa em plano mais aberto\n- [x] 12. Rea\u00e7\u00e3o muda logo ap\u00f3s abrir (sorriso leve)\n- [x] 13. Primeiro gole olhando pra c\u00e2mera\n- [x] 14. Primeiro gole olhando pro lado\n- [x] 15. Close no rosto reagindo\n- [x] 16. Segundo gole mais relaxado\n- [x] 22. Levantando a garrafa em dire\u00e7\u00e3o \u00e0 c\u00e2mera\n- [x] 23. Sentada no tapete, garrafa apoiada no joelho\n- [x] 24. Close final da garrafa + piscina\n- [x] 25. Sorriso natural pra c\u00e2mera (2s)\n- [ ] \u201cDepois do yoga, eu s\u00f3 quero uma coisa: refrescar sem jogar a\u00e7\u00facar no corpo.\u201d\n- [ ] \u201cPorque quase toda bebida \u2018fit\u2019 ou \u00e9 sem gra\u00e7a, ou cheia de coisa artificial.\u201d\n- [ ] \u201cA\u00ed eu descobri a Bewow Kombucha: zero a\u00e7\u00facar, s\u00f3 15 calorias e cheia de probi\u00f3ticos de verdade.\u201d\n- [ ] \u201cEsse sabor de abacaxi com hortel\u00e3 \u00e9 muito refrescante. Parece refrigerante, mas cuida de mim.\u201d\n- [ ] \u201cDepois me conta qual sabor voc\u00ea escolheria. Usa o cupom B yHyDlyIRmsyrEL91hL1ElFSK7lSLd/view?usp=drive_link\n- Essencial escrever Hellmann's corretamente (2 L, 2 N e ap\u00f3strofo) e pronunciar r\u00e9lm\u00e3ns.\n- O objetivo \u00e9 apresentar novas receitas com Hellmann\u2019s, sem desvalorizar a salada de maionese.\n- N\u00e3o pode aparecer menores de 18 anos.\n- Atentar aos Do\u2019s e Don\u2019ts no final do briefing.\n\nMarca\u00e7\u00f5es obrigat\u00f3rias\n\n- Marcar \\@hellmannsbr\n- Incluir a hashtag #nabocadopovo na legenda\n\nQualquer d\u00favida, estou \u00e0 disposi\u00e7\u00e3o! \ud83d\udc9c\n\nComo o formato sera\u0301 UGC, na\u0303o teremos aprovac\u0327a\u0303o de conteu\u0301dos, enta\u0303o voc\u00ea deve postar o conteu\u0301do direto na rede e apenas me enviar o link aqui e adicionar na plataforma MIS para validarmos a entrega"},

ide=id.g3723dfd471e_0_0#slide=id.g3723dfd471e_0_0\n\nCTA: S\u00f3 teremos essa informa\u00e7\u00e3o p\u00f3s Black\n\n##### N\u00e3o fazer\n\n\uffeb Jamais tratar a origem da marca de modo estereotipado ou desrespeitoso;\n\uffeb N\u00e3o citar ou mostrar nenhuma outra marca;\n\uffeb N\u00e3o usar produtos de marcas concorrentes;\n\uffeb N\u00e3o expressar nenhum tipo de preconceito ou segrega\u00e7\u00e3o de qualquer natureza, bem como usar qualquer palavra ou termo que tenham essa interpreta\u00e7\u00e3o;\n\uffeb N\u00e3o utilizar filtros ou realizar edi\u00e7\u00f5es nas fotos que distor\u00e7am a realidade;\n\uffeb N\u00e3o utilizar palavras de baixo cal\u00e3o ou de tom preconceituoso e express\u00f5es preconceituosas naturalizadas;\n\uffeb N\u00e3o realizar fotos e/ou v\u00eddeos com embalagens lacradas/s\u00f3 dentro da caixa;\n\uffeb N\u00e3o relacionar o conte\u00fado da marca com religi\u00e3o ou pol\u00edtica;\n\uffeb N\u00e3o filmar de cima para baixo, sem foco ou em ambiente escuro;\n\uffeb N\u00e3o postar nenhum conte\u00fado sem aprova\u00e7\u00e3o pr\u00e9via da marca.\n\n---\n\n##### Conte\u00fado\n\nPublica\u00e7\u00e3o\n\n\\-\n\n**Produ\u00e7\u00e3o de conte\u00fado**\n\n###### M\u00ednimos sugeridos:\n\n3 Stories\n\n##### Conte\u00fados contratados\n\nFazer stories\n\n\\-\n\n**3 no m\u00ednimo**"},

3o, ele t\u00e1 no TikTok Shop.\u201d\n\n---\n\n# \ud83c\udfac ROTEIRO 3 \u2014 HUMOR\n\n\ud83c\udfa5 **CENA 1 \u2014 GANCHO**\n\nVoc\u00ea olhando a bagun\u00e7a.\n\n\ud83c\udf99\n\u201cMinha penteadeira depois que eu disse que ia comprar s\u00f3 1 batom.\u201d\n\n---\n\n\ud83c\udfa5 **CENA 2 \u2014 PROBLEMA**\n\nProdutos caindo.\n\n\ud83c\udf99\n\u201cN\u00e3o cabe mais nada aqui.\u201d\n\n---\n\n\ud83c\udfa5 **CENA 3 \u2014 SOLU\u00c7\u00c3O**\n\nMostra o organizador.\n\n\ud83c\udf99\n\u201cAt\u00e9 que achei isso aqui.\u201d\n\n---\n\n\ud83c\udfa5 **CENA 4 \u2014 DEMONSTRA\u00c7\u00c3O**\n\nGirando.\n\n\ud83c\udf99\n\u201cAgora tudo gira e eu acho tudo.\u201d\n\n---\n\n\ud83c\udfa5 **CTA**\n\n\u201cEu deixei ele no carrinho aqui.\u201d\n\n---\n\n# \ud83c\udfac ROTEIRO 4 \u2014 ROTINA REAL (UGC)\n\n\ud83c\udfa5 **CENA 1 \u2014 GANCHO**\n\nCena se arrumando.\n\n\ud83c\udf99\n\u201cUma coisa que mudou minha rotina de maquiagem\u2026\u201d\n\n---\n\n\ud83c\udfa5 **CENA 2 \u2014 PROBLEMA**\n\nProcurando produto.\n\n\ud83c\udf99\n\u201cEu perdia muito tempo procurando tudo.\u201d\n\n---\n\n\ud83c\udfa5 **CENA 3 \u2014 SOLU\u00c7\u00c3O**\n\nMostra organizador.\n\n\ud83c\udf99\n\u201cAgora eu deixo tudo aqui.\u201d\n\n---\n\n\ud83c\udfa5 **CENA 4 \u2014 DEMONSTRA\u00c7\u00c3O**\n\nGirando para pegar os produtos.\n\n\ud83c\udf99\n\u201cS\u00f3 girar e pegar.\u201d\n\n---\n\n\ud83c\udfa5 **CTA**\n\n\u201cSe voc\u00ea tem muita make, vale muito.\u201d\n\n---\n\n# \ud83c\udfac ROTEIRO 5 \u2014 PROVA DE VALOR\n\n\ud83c\udfa5 **CENA 1 \u2014 GANCHO**\n\nTexto:\n**\u201cEsse organizador custa menos que um batom.\u201d**\n\n---\n\n\ud83c\udfa5 **CENA 2 \u2014 PROBLEMA**\n\nMostra a bagun\u00e7a.\n\n\ud83c\udf99\n\u201cE resolve um problema enorme.\u201d\n\n---\n\n\ud83c\udfa5 **CENA 3 \u2014 SOLU\u00c7\u00c3O**\n\nMostra organizador cheio.\n\n\ud83c\udf99\n\u201cEconomiza espa\u00e7o e deixa tudo vis\u00edvel.\u201d\n\n---\n\n\ud83c\udfa5 **CENA 4 \u2014 DEMONSTRA\u00c7\u00c3O**\n\nGira.\n\n\ud83c\udf99\n\u201cE ainda gira 360\u00b0.\u201d\n\n---\n\n\ud83c\udfa5 **CTA**\n\n\ud83c\udf99\n\u201cEu deixei o link aqui no carrinho do TikTok.\u201d\n### TAKES PARA GRAVA\u00c7\u00c3O\n- [ ] Take 1\n- [ ] Close da penteadeira bagun\u00e7ada.\n- [ ] Take 2\n- [ ] Voc\u00ea tentando pegar um produto no fundo.\n- [ ] Take 3\n- [ ] Produtos caindo da mesa.\n- [ ] Take 4\n- [ ] Voc\u00ea olhando a bagun\u00e7a com cara de frustra\u00e7\u00e3o.\n- [ ] Take 5\n- [ ] Voc\u00ea tirando v\u00e1rios produtos da gaveta.\n- [ ] Take 6\n- [ ] Caixa fechada em cima da mesa.\n- [ ] Take 7\n- [ ] Abrindo a caixa.\n- [ ] Take 8\n- [ ] Tirando o organizador da embalagem.\n- [ ] Take 9\n- [ ] Close no produto novo.\n- [ ] Take 10\n- [ ] Montando o organizador.\n- [ ] Take 11\n- [ ] Encaixando as partes.\n- [ ] Take 12\n- [ ] Close mostrando o material.\n- [ ] Take 13\n- [ ] Colocando maquiagem.\n- [ ] Take 14\n- [ ] Colocando perfumes.\n- [ ] Take 15\n- [ ] Colocando skincare.\n- [ ] Take 16\n- [ ] Organizador cheio.\n- [ ] Take 17\n- [ ] Girando o organizador lentamente.\n- [ ] Take 18\n- [ ] Girando e pegando um produto.\n- [ ] Take 19\n- [ ] Close do giro.\n- [ ] Take 20\n- [ ] Giro r\u00e1pido mostrando v\u00e1rios produtos.\n- [ ] Take 21\n- [ ] Mesa bagun\u00e7ada.\n- [ ] Take 22\n- [ ] Mesa organizada.\n- [ ] Take 23\n- [ ] Zoom no organizador cheio.\n- [ ] Take 24\n- [ ] Voc\u00ea se maquiando.\n- [ ] Take 25\n- [ ] Pegando produto no organizador.\n- [ ] Take 26\n- [ ] Girando para pegar outro produto."},
    {id:uid(),title:"SAINT GERMAN",desc:"[AFILIAÇÃO] Como divulgar: Feed: Você pode escolher o formato que preferir: Reels foto ou carrossel. O conteúdo precisa falar sobre",cat:"conteudo",tag:"",value:124.0,due:"2026-03-29",prio:"medium",col:"doing",notes:"Como divulgar:\n\nFeed:\nVoc\u00ea pode escolher o formato que preferir: Reels foto ou carrossel. O conte\u00fado precisa falar sobre a promo\u00e7\u00e3o:\n\n\u272824 horas, 24 produtos a partir de R$124 cada\u2728\n\nStories:\n\n- 1\u00aa tela: unboxing do produto\n- 2\u00aa tela: stories falando sobre a campanha \u201c24 HORAS, 24 PRODUTOS\" (n\u00e3o \u00e9 v\u00e1lido est\u00e1tico e sim falado, viu? \ud83d\ude09)\n\n\u26a0\ufe0f Importante:\n\n- Assim que o post de feed estiver no ar, me envia o link para validarmos o cupom, combinado?\n- Todos os posts devem ser postados na data combinada.\n- Adicione as informa\u00e7\u00f5es da campanha na legenda do post e n\u00e3o esque\u00e7a de adicionar tamb\u00e9m o seu cupom.\n\n  \\---------------------------------------------------------------------\n\n### \ud83d\udce6 Story 0 \u2013 Unboxing (SEM FALA)\n\n_(v\u00eddeo com m\u00fasica \u2013 j\u00e1 pronto)_\n\ud83d\udc49 S\u00f3 coloca um texto na tela:\n\n- \u201cChegou meu \u00f3culos da Saint German \ud83d\ude0d\u201d\n- \u201cOlha isso\u2026\u201d\n- \u201cPerfeito demais \u2728\u201d\n\n---\n\n### \ud83d\ude0e Story 1 \u2013 Voc\u00ea usando (entra a fala)\n\n_(no carro, com o \u00f3culos)_\n\n\"Gente, eu n\u00e3o aguentei esperar e j\u00e1 sa\u00ed usando \ud83d\ude02\"\n\n\"Olha esse \u00f3culos\u2026 s\u00e9rio!\"\n\n---\n\n### \u2728 Story 2 \u2013 Valoriza\u00e7\u00e3o do produto\n\n\"Ele \u00e9 muito estiloso e levanta qualquer look n\u00e9?\"\n\n_(vira o rosto, mostra bem o \u00f3culos)_\n\n---\n\n### \ud83d\udd25 Story 3 \u2013 Gancho da promo\u00e7\u00e3o\n\n\"Mas agora eu preciso te contar uma coisa MUITO boa da Saint German\u2026\"\n\n---\n\n### \ud83d\udca5 Story 4 \u2013 Oferta\n\n\"T\u00e1 rol     {id:uid(),title:"LEAVIN PANTENE",desc:"ROTEIRO: ROTEIRO COM NARRAÇÃO (30s) Estilo: clean, íntimo, desejável Vibe: “segredo de verão” ⏱ 0–3s — Gancho Cena: Clos",cat:"conteudo",tag:"revisao",value:0,due:"",prio:"medium",col:"review",notes:"ROTEIRO:\n\n# ROTEIRO COM NARRA\u00c7\u00c3O (30s)\n\n**Estilo:** clean, \u00edntimo, desej\u00e1vel\n**Vibe:** \u201csegredo de ver\u00e3o\u201d\n\n### \u23f1 0\u20133s \u2014 Gancho\n\n**Cena:** Close no cabelo molhado escorrendo \u00e1gua, sol batendo.\n**Narra\u00e7\u00e3o:**\n\n> \u201cSeu cabelo n\u00e3o quebra por fora\u2026 ele quebra por dentro.\u201d\n\n---\n\n### \u23f1 4\u20139s \u2014 Dor\n\n**Cena:** Voc\u00ea torcendo levemente uma mecha, ela arma/frizza.\n**Narra\u00e7\u00e3o:**\n\n> \u201cPiscina, sol, qu\u00edmica e calor detonam as liga\u00e7\u00f5es internas do fio.\u201d\n\n---\n\n### \u23f1 10\u201315s \u2014 Solu\u00e7\u00e3o\n\n**Cena:** Mostra o produto e aplica no comprimento.\n**Narra\u00e7\u00e3o:**\n\n> \u201cEsse leave-in repara milh\u00f5es de liga\u00e7\u00f5es moleculares em cada aplica\u00e7\u00e3o.\u201d\n\n---\n\n### \u23f1 16\u201322s \u2014 Prova\n\n**Cena:** Dedos deslizando no cabelo + mergulho + sa\u00edda em slow motion.\n**Narra\u00e7\u00e3o:**\n\n> \u201cResultado: cabelo mais forte, macio e com frizz sob controle.\u201d\n\n---\n\n### \u23f1 23\u201327s \u2014 Desejo\n\n**Cena:** Voc\u00ea andando na beira da piscina, cabelo ao vento.\n**Narra\u00e7\u00e3o:**\n\n> \u201c\u00c9 o cabelo que voc\u00ea sente orgulho de usar solto.\u201d\n\n---\n\n### \u23f1 28\u201330s \u2014 CTA\n\n**Cena:** Close no produto.\n**Narra\u00e7\u00e3o:**\n\n> \u201cPantene Molecular Bond Repair.\n> Reconstru\u00e7\u00e3o de dentro pra fora.\u201d\n\n---\n\n# \ud83c\udfac OP\u00c7\u00c3O 2 \u2014 ROTEIRO SENSORIAL (sem fala)\n\n**Estilo:** est\u00e9tico, slow, premium\n**Som:** m\u00fasica leve + \u00e1gua + vento\n\nTempo:\n\nCena0\u20133s\u00c1gua da piscina em slow motion + reflexo do sol\n\n4\u20137sClose no cabelo molhado escorrendo\n\n8\u201311sM\u00e3o abrindo o produto, textura na palma\n\n12\u201315sAplica\u00e7\u00e3o em slow\n\n16\u201319sDedos deslizando sem travar\n\n20\u201323sMergulho + sa\u00edda em c\u00e2mera lenta\n\n24\u201327sCaminhada com cabelo solto\n\n28\u201330sProduto em foco + texto na tela: **\u201cReconstru\u00e7\u00e3o molecular de dentro pra fora\u201d**\n### TAKES PARA GRAVA\u00c7\u00c3O\n- [ ] Close no cabelo molhado escorrendo \u00e1gua\n- [ ] Voc\u00ea com cabelo preso, express\u00e3o neutra\n- [ ] Apertando uma mecha (mostrando frizz/porosidade)\n- [ ] Detalhe do cabelo opaco antes da aplica\u00e7\u00e3o\n- [ ] Close da embalagem com sol batendo\n- [ ] Abrindo a tampa em slow motion\n- [ ] Textura do leave-in saindo na m\u00e3o\n- [ ] Espalhando o produto na palma\n- [ ] Aplicando no comprimento (frente)\n- [ ] Aplicando por tr\u00e1s (cabelo jogado pra frente)\n- [ ] Close dos dedos deslizando\n- [ ] Close do fio ficando alinhado\n- [ ] Mergulho de costas\n- [ ] Sa\u00edda da piscina em slow\n- [ ] Passando a m\u00e3o no cabelo molhado\n- [ ] Jogando o cabelo para tr\u00e1s (hair flip)\n- [ ] Caminhando na borda da piscina\n- [ ] Close sorrindo com cabelo solto\n- [ ] Close lateral com vento\n- [ ] Plano m\u00e9dio girando o corpo\n- [ ] Close do produto na m\u00e3o\n- [ ] Produto apoiado na borda da piscina\n- [ ] Voc\u00ea segurando o produto e sorrindo\n- [ ] Produto em foco + fundo desfocado\n- [ ] Gotas d\u2019\u00e1gua caindo do cabelo\n- [ ] Movimento de cabelo em slow\n- [ ] Close do sol refletindo na \u00e1gua\n- [ ] Textura do cabelo seco depois\n- [ ] Close das pontas\n- [ ] Produto girando em 360\u00b0"},

\n# \ud83d\udcf2 LEGENDA (obrigat\u00f3ria)\n\nCABELO mais encorpado desde o primeiro uso \u2728\n\nEu pinto o cabelo e a qu\u00edmica deixa meus fios mais finos, ent\u00e3o resolvi fazer um teste metade do cabelo com **Elseve Col\u00e1geno Lifter de L\u2019Or\u00e9al Paris** e metade sem.\n\nResultado: **inje\u00e7\u00e3o de massa nos fios** e cabelo muito mais encorpado.\n\n#Publicidade #ElseveHairCare #ElseveCol\u00e1geno #CabeloElseve #LorealParis\n\n\\@lorealparis_brasil\n\\@lorealparis\n\\@lorealparisbrasil\n\n---\n\n# \ud83d\udd25 3 TRUQUES PARA ESSE V\u00cdDEO VIRALIZAR\n\n\ud83d\udca1 **1. Corte r\u00e1pido (estilo TikTok)**\nCada cena com **2\u20133 segundos**.\n\n\ud83d\udca1 **2. Express\u00e3o no react**\nCara de **\u201cnossa!\u201d** no teste do n\u00f3 aumenta reten\u00e7\u00e3o.\n\n\ud83d\udca1 **3. Revela\u00e7\u00e3o dram\u00e1tica**\nAntes de mostrar o cabelo diga:\n\u201cAgora olha isso\u2026\u201d"},

    {id:uid(),title:"AVON - ID COLLECTION - R$340,00",desc:"[MIS] Oii, tudo bem? 😊💜 Aqui é a Bia do time de Atendimento MIS e vou te acompanhar na campanha de Avon | Iconic Collection ✨",cat:"conteudo",tag:"a_receber",value:340.0,due:"2026-05-13",prio:"high",col:"done",notes:"Oii, tudo bem? \ud83d\ude0a\ud83d\udc9c\n\nAqui \u00e9 a Bia do time de Atendimento MIS e vou te acompanhar na campanha de Avon | Iconic Collection \u2728\n\nINFLU: val_barros\n\nSeu kit deve ser enviado em breve, assim que ele chegar, pe\u00e7o por favor que me avise por aqui \ud83d\ude4f\ud83d\udce6\n\nRASTREIO: AD423774662BR\nIMPORTANTE ACOMPANHAR O RASTREIO\n\nPRAZO DE POSTAGEM AT\u00c9 O DIA 13/05/25\n\nAssim que tivermos a confirma\u00e7\u00e3o do recebimento, vamos encaminhar os direcionais finais da campanha + o prazo oficial de postagem, combinado? \ud83d\ude0a\n\nJ\u00e1 adiantando alguns pontos importantes do briefing:\nVoc\u00ea pode acessar pelo app (card da campanha > escopo > briefing)\n\u2728 O conte\u00fado ser\u00e1 um v\u00eddeo curto e espont\u00e2neo, trazendo uma resenha da fragr\u00e2ncia recebida\n\u2728 A ideia \u00e9 um tom leve e natural, como dica de amiga\n\u2728 O foco \u00e9 traduzir a fragr\u00e2ncia em sensa\u00e7\u00f5es, personalidade e momentos de uso\n\n\u26a0\ufe0f Alguns pontos de aten\u00e7\u00e3o importantes:\n\n- N\u00e3o usar a palavra \u201cperfume\u201d (usar \u201cfragr\u00e2ncia\u201d ou \u201cdeo parfum\u201d)\n- N\u00e3o mostrar outras marcas no v\u00eddeo\n- N\u00e3o relacionar o produto a esporte ou praia\n- Evitar filtros/luz amarelada\n- Priorizar um ambiente bem iluminado e elegante\n- Marca\u00e7\u00e3o obrigat\u00f3ria: \\@\u200cavonbrasil + #publi\n\nAssim que voc\u00ea receber o kit, me avisa para seguirmos com os pr\u00f3ximos passos \ud83d\udc9c\n\n\n---\n\n**\ud83c\udfac ROTEIRO REVISADO \u2014 AVON ICONIC COLLECTION** _Formato: TikTok/Reels | 35\u201345s | Tom: review elegante como dica de amiga_\n\n---\n\n**\ud83c\udfa5 CENA 1 \u2014 GANCHO VISUAL (0\u20133s)**\n\n\ud83d\udcf8 Fragr\u00e2ncia no centro da penteadeira, c\u00e2mera fixa, luz natural lateral. Sua m\u00e3o entra e puxa o frasco devagar.\n\n\u2728 **TEXTO:** _\"Tem fragr\u00e2ncias que passam. Outras viram \u00edcone.\"_\n\n\ud83d\udd0a Som sutil + trilha branca elegante baixa\n\n---\n\n**\ud83c\udfa5 CENA 2 \u2014 PRIMEIRA IMPRESS\u00c3O (3\u20138s)**\n\n\ud83d\udcf8 Close segurando o frasco perto do rosto. Voc\u00ea sente o cheiro, rea\u00e7\u00e3o genu\u00edna.\n\n\ud83c\udf99\ufe0f **FALA:** _\"Gente\u2026 quando eu abri esse frasco da Avon Iconic Collection pela primeira vez, eu entendi imediatamente por que o nome \u00e9 esse.\"_\n\n\ud83d\udcdd **TEXTO:** _\"primeira impress\u00e3o\"_\n\n---\n\n**\ud83c\udfa5 CENA 3 \u2014 FAM\u00cdLIA OLFATIVA + PERSONALIDADE (8\u201318s)**\n\n\ud83d\udcf8 Voc\u00ea na penteadeira, colocando brinco, frasco bem vis\u00edvel na cena.\n\n\ud83c\udf99\ufe0f **FALA:** _\"Ela \u00e9 [floral/\u00e2mbar/chypre \u2014 preencher conforme a fragr\u00e2ncia recebida], com aquele [nota de destaque] que fica na mem\u00f3ria. \u00c9 daquelas que a pessoa passa e voc\u00ea vira pra olhar.\"_\n\n\ud83d\udcf8 Corte: close na tampa dourada \u2192 borrifando no pesco\u00e7o _(mostrar bem as borrifadas)_\n\n\ud83d\udcdd **TEXTO:** _\"[caracter\u00edstica 1] \u2022 [caracter\u00edstica 2] \u2022 marcante\"_\n\n---\n\n**\ud83c\udfa5 CENA 4 \u2014 FIXA\u00c7\u00c3O E PROJE\u00c7\u00c3O (18\u201325s)**\n\n\ud83d\udcf8 Close no pulso, espalhando levemente.\n\n\ud83c\udf99\ufe0f **FALA:** _\"A fixa\u00e7\u00e3o \u00e9 \u00f3tima \u2014 ela fica com voc\u00ea o dia inteiro sem precisar reaplicar. E a proje\u00e7\u00e3o \u00e9 aquele equil\u00edbrio perfeito: presente, mas sem ser pesada. Exatamente o que eu quero num deo parfum do dia a dia.\"_\n\n\ud83d\udcdd **TEXTO:** _\"fixa\u00e7\u00e3o longa \u2022 proje\u00e7\u00e3o equilibrada\"_\n\n---\n\n**\ud83c\udfa5 CENA 5 \u2014 MOMENTO DE USO (25\u201333s)**\n\n\ud83d\udcf8 Voc\u00ea pegando a bolsa, dando uma \u00faltima olhada no espelho antes de sair.\n\n\ud83c\udf99\ufe0f **FALA:** _\"Pra mim \u00e9 perfeita pra jantar, pra um encontro, evento\u2026 ou naqueles dias que voc\u00ea simplesmente quer se sentir bem arrumada mesmo sem ter nada especial marcado.\"_\n\n\u2728 Cortes suaves acompanhando a m\u00fasica\n\n---\n\n**\ud83c\udfa5 CENA 6 \u2014 FECHAMENTO EMOCIONAL (33\u201341s)**\n\n\ud83d\udcf8 Voc\u00ea de frente pro espelho, aplicando uma \u00faltima vez. Close no vidro refletindo a luz.\n\n\ud83c\udf99\ufe0f **FALA:** _\"Eu acho que \u00e9 isso que faz uma fragr\u00e2ncia virar \u00edcone \u2014 quando ela continua atual independente do tempo. A Avon entendeu isso com essa cole\u00e7\u00e3o.\"_\n\n---\n\n**\ud83c\udfa5 CENA 7 \u2014 CTA NATURAL (41\u201345s)**\n\n\ud83d\udcf8 Voc\u00ea sorrindo segurando o frasco, logo da Avon vis\u00edvel.\n\n\ud83c\udf99\ufe0f **FALA:** _\"Se voc\u00ea ainda n\u00e3o conhece a Iconic Collection, vai l\u00e1 no perfil da \\@avonbrasil \u2014 vale muito.\"_\n\n\ud83d\udcdd **TEXTO FINAL:** _\\@avonbrasil | #publi_"},
