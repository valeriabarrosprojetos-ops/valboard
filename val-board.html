function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function persist(cardId) {
  // Salvar card específico ou todos
  if (cardId) {
    const c = cards.find(x => x.id === cardId);
    if (c) saveCardToDB(c);
  } else {
    // Salvar todos (usado no saveCard do modal)
    cards.forEach(c => saveCardToDB(c));
  }
}

// ── RENDER ───────────────────────────────────────────────────────────
function render() {
  renderStats();
  renderBoard();
}

function renderStats() {
  const active = cards.filter(c => c.col !== 'done');
  const done = cards.filter(c => c.col === 'done');
  const urgent = cards.filter(c => c.prio === 'high' && c.col !== 'done');
  const inProgress = cards.filter(c => c.col === 'doing');

  document.getElementById('statsRow').innerHTML = `
    <div class="stat-item"><div class="stat-value">${cards.length}</div><div class="stat-label">Total tarefas</div></div>
    <div class="stat-item"><div class="stat-value orange">${active.length}</div><div class="stat-label">Em aberto</div></div>
    <div class="stat-item"><div class="stat-value" style="color:var(--green)">${done.length}</div><div class="stat-label">Concluídas</div></div>
    <div class="stat-item"><div class="stat-value" style="color:var(--red)">${urgent.length}</div><div class="stat-label">Alta prioridade</div></div>
    <div class="stat-item"><div class="stat-value" style="color:var(--blue)">${inProgress.length}</div><div class="stat-label">Em andamento</div></div>
  `;
}

function fmtMoney(v) {
  if (!v) return 'R$ —';
  return 'R$ ' + v.toLocaleString('pt-BR', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
}

function renderBoard() {
  const board = document.getElementById('board');
  board.innerHTML = '';

  const today = todayStr();
  const in7 = daysFromNow(7);

  let visible = filter === 'all' ? cards : cards.filter(c => c.cat === filter);

  // Filtro de prazo
  if (dueFilter === 'overdue') {
    visible = visible.filter(c => (c.due && c.due < today && c.col !== 'done') || (c.payDate && c.payDate < today && c.col !== 'done'));
  } else if (dueFilter === 'today') {
    visible = visible.filter(c => c.due === today || c.payDate === today);
  } else if (dueFilter === 'week') {
    visible = visible.filter(c => (c.due && c.due >= today && c.due <= in7) || (c.payDate && c.payDate >= today && c.payDate <= in7));
  } else if (dueFilter === 'nodue') {
    visible = visible.filter(c => (!c.due || c.due === '') && (!c.payDate || c.payDate === ''));
  }

  // Filtro de tipo/tag (só para conteudo e engenharia)
  if (tagFilter !== 'all') {
    visible = visible.filter(c => c.tag === tagFilter);
  }

  // Filtro de status
  if (statusFilter !== 'all') {
    visible = visible.filter(c => c.status === statusFilter);
  }

  const colsToRender = (filter === 'pessoal') ? COLS_PESSOAL : COLS;
  colsToRender.forEach(col => {
    const colCards = visible.filter(c => c.col === col.id);
    const allCount = cards.filter(c => c.col === col.id).length;

    const colEl = document.createElement('div');
    colEl.className = 'column';
    colEl.innerHTML = `
      <div class="col-header">
        <div class="col-title-wrap">
          <div class="col-bar" style="background:${col.color}"></div>
          <span class="col-name">${col.label}</span>
        </div>
        <span class="col-badge">${allCount}</span>
      </div>
      <div class="col-body" id="col-${col.id}"
        ondragover="onDragOver(event,'${col.id}')"
        ondrop="onDrop(event,'${col.id}')"
        ondragleave="onDragLeave(event)">
        ${colCards.length === 0 ? '<div class="empty-state">✦<br>Nenhuma tarefa</div>' : ''}
        ${colCards.map(c => cardHTML(c)).join('')}
        <button class="col-add-btn" onclick="openModal('${col.id}')">
          <span style="font-size:15px;line-height:1">+</span> Adicionar
        </button>
      </div>
    `;
    board.appendChild(colEl);
  });
}

function cardHTML(c) {
  const today = todayStr();
  const in3 = daysFromNow(3);
  let dueClass = '';
  let dueIcon = '📅';
  if (c.due) {
    if (c.due < today) { dueClass = 'overdue'; dueIcon = '⚠️'; }
    else if (c.due <= in3) { dueClass = 'soon'; dueIcon = '🔔'; }
  }

  const dotCls = { high: 'dot-high', medium: 'dot-medium', low: 'dot-low' }[c.prio] || 'dot-medium';

  return `
    <div class="card cat-${c.cat}" id="card-${c.id}"
      draggable="true"
      ondragstart="onDragStart(event,'${c.id}')"
      ondragend="onDragEnd(event)">
      <div class="card-head">
        <div class="card-title">${esc(c.title)}</div>
        <div class="card-menu">
          <button class="card-btn" onclick="openEdit('${c.id}')" title="Editar">✏️</button>
          <button class="card-btn" onclick="askDelete('${c.id}')" title="Excluir">🗑️</button>
        </div>
      </div>
      ${c.desc ? `<div class="card-desc">${esc(c.desc)}</div>` : ''}
      <div class="card-meta">
        <span class="chip chip-${c.cat}">${CAT_EMOJI[c.cat]} ${CAT_LABELS[c.cat]}</span>
        ${c.tag ? `<span class="chip chip-${c.tag}">${c.tag.replace(/_/g,' ').toUpperCase()}</span>` : ''}
        ${c.cat === 'prospeccao' && c.status ? `<span class="status-badge status-${c.status}">${STATUS_LABELS[c.status] || c.status}</span>` : ''}
      </div>
      ${c.notes ? `<div class="card-has-notes">📝 ${c.notes.split('\n').length} linha${c.notes.split('\n').length > 1 ? 's' : ''} de anotações</div>` : ''}
      <div class="card-footer">
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
          <div class="priority-dot ${dotCls}"></div>
          ${c.due ? `<span class="card-due ${dueClass}" title="Entrega">${dueIcon} ${fmtDate(c.due)}</span>` : '<span class="card-due">Sem prazo</span>'}
          ${(c.cat === 'conteudo' || c.cat === 'engenharia') && c.payDate ? `<span class="card-due" style="color:var(--green)" title="Receb. pagamento">💰 ${fmtDate(c.payDate)}</span>` : ''}
        </div>
        ${c.value > 0 ? `<span class="card-value">${fmtMoney(parseFloat(c.value))}</span>` : ''}
      </div>
    </div>
  `;
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtDate(d) {
  const [y,m,day] = d.split('-');
  return `${day}/${m}/${y.slice(2)}`;
}

function todayStr() { return new Date().toISOString().split('T')[0]; }

function daysFromNow(n) {
  const d = new Date();
  d.setDate(d.getDate() + n);
  return d.toISOString().split('T')[0];
}

// ── FILTER ───────────────────────────────────────────────────────────

  filter = f;
  tagFilter = 'all';
  if (f !== 'prospeccao') { statusFilter = 'all'; }
  document.querySelectorAll('[data-filter]').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  updateTipoFilterRow(f);
  render();
}

// ── DRAG & DROP ──────────────────────────────────────────────────────
function onDragStart(e, id) {
  dragId = id;
  setTimeout(() => { const el = document.getElementById('card-'+id); if(el) el.classList.add('dragging'); }, 0);
}

function onDragEnd(e) {
  if (dragId) { const el = document.getElementById('card-'+dragId); if(el) el.classList.remove('dragging'); }
  document.querySelectorAll('.col-body').forEach(c => c.classList.remove('drag-over'));
  dragId = null;
}

function onDragOver(e, colId) {
  e.preventDefault();
  document.querySelectorAll('.col-body').forEach(c => c.classList.remove('drag-over'));
  const el = document.getElementById('col-'+colId);
  if (el) el.classList.add('drag-over');
}

function onDragLeave(e) { e.currentTarget.classList.remove('drag-over'); }

function onDrop(e, colId) {
  e.preventDefault();
  if (dragId) {
    const c = cards.find(x => x.id === dragId);
    if (c) { c.col = colId; persist(); render(); }
  }
  document.querySelectorAll('.col-body').forEach(c => c.classList.remove('drag-over'));

// ── AGENDA ───────────────────────────────────────────────────────────
function renderAgenda() {
  const today = todayStr();
  const in3 = daysFromNow(3);
  const body = document.getElementById('agendaBody');
  const label = document.getElementById('todayLabel');
  if (!body) return;

  const d = new Date();
  const dias = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const meses = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  if (label) label.textContent = `${dias[d.getDay()]}, ${d.getDate()} ${meses[d.getMonth()]}`;

  const active = cards.filter(c => c.col !== 'done' && (c.due || c.payDate));

  const overdue = active.filter(c => (c.due && c.due < today) || (c.payDate && c.payDate < today)).sort((a,b) => (a.due||'').localeCompare(b.due||''));
  const todayCards = active.filter(c => c.due === today || c.payDate === today);
  const soonCards = active.filter(c => (c.due && c.due > today && c.due <= in3) || (c.payDate && c.payDate > today && c.payDate <= in3)).sort((a,b) => (a.due||a.payDate||'').localeCompare(b.due||b.payDate||''));

  let html = '';

  if (overdue.length) {
    html += `<div class="task-group">
      <div class="task-group-label label-overdue">⚠️ Atrasado (${overdue.length})</div>
      ${overdue.map(c => taskItemHTML(c, 'overdue')).join('')}
    </div>`;
  }

  if (todayCards.length) {
    html += `<div class="task-group">
      <div class="task-group-label label-today">⭐ Hoje (${todayCards.length})</div>
      ${todayCards.map(c => taskItemHTML(c, 'today')).join('')}
    </div>`;
  } else {
    html += `<div class="task-group">
      <div class="task-group-label label-today">⭐ Hoje</div>
      <div style="padding:10px 12px;font-size:12px;color:var(--text3);">Nenhuma tarefa para hoje 🎉</div>
    </div>`;
  }

  if (soonCards.length) {
    html += `<div class="task-group">
      <div class="task-group-label label-soon">📅 Próximos 3 dias (${soonCards.length})</div>
      ${soonCards.map(c => taskItemHTML(c, 'soon')).join('')}
    </div>`;
  }

  if (!overdue.length && !todayCards.length && !soonCards.length) {
    html = `<div class="no-tasks">✨<br><br>Nada pendente nos<br>próximos dias!</div>`;
  }

  body.innerHTML = html;
}

function taskItemHTML(c, type) {
  const catEmoji = { conteudo:'🎬', engenharia:'📐', prospeccao:'📞', pessoal:'🏠' };
  const badgeClass = { overdue:'badge-overdue', today:'badge-today', soon:'badge-soon' }[type];
  const dueLabel = type === 'overdue' ? `⚠️ ${fmtDate(c.due)}` : type === 'today' ? 'Hoje' : fmtDate(c.due);
  return `
    <div class="task-item ${type}" onclick="goToCard('${c.id}')">
      <div class="task-check" onclick="event.stopPropagation();markDone('${c.id}')"></div>
      <div class="task-info">
        <div class="task-name">${esc(c.title)}</div>
        <div class="task-meta">
          <span>${catEmoji[c.cat] || ''} ${CAT_LABELS[c.cat] || c.cat}</span>
          ${c.tag ? `<span>${c.tag}</span>` : ''}
        </div>
      </div>
      <span class="task-due-badge ${badgeClass}">${dueLabel}</span>
    </div>`;
}

// ── CALENDAR ─────────────────────────────────────────────────────────
let calYear = new Date().getFullYear();
let calMonth = new Date().getMonth();

function renderCalendar(year, month) {
  const wrap = document.getElementById('calWrap');
  if (!wrap) return;

  const today = new Date();
  const meses = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const dias = ['D','S','T','Q','Q','S','S'];

  // Dias com tarefas
  const taskDays = {};
  cards.filter(c => c.due && c.col !== 'done').forEach(c => {
    const [y,m,d] = c.due.split('-').map(Number);
    if (y === year && m-1 === month) {
      const key = d;
      const isOver = c.due < today.toISOString().split('T')[0];
      taskDays[key] = isOver ? 'overdue' : 'task';
    }
  });

  const first = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const daysInPrev = new Date(year, month, 0).getDate();

  let cells = '';
  // Prev month
  for (let i = first-1; i >= 0; i--) {
    cells += `<div class="cal-day other-month">${daysInPrev-i}</div>`;
  }
  // Current month
  for (let d = 1; d <= daysInMonth; d++) {
    const isToday = year === today.getFullYear() && month === today.getMonth() && d === today.getDate();
    const taskType = taskDays[d];
    const cls = [
      'cal-day',
      isToday ? 'today' : '',
      taskType === 'overdue' ? 'has-overdue' : taskType === 'task' ? 'has-task' : ''
    ].filter(Boolean).join(' ');
    cells += `<div class="${cls}">${d}</div>`;
  }
  // Next month fill
  const total = first + daysInMonth;
  const nextDays = total % 7 === 0 ? 0 : 7 - (total % 7);
  for (let d = 1; d <= nextDays; d++) {
    cells += `<div class="cal-day other-month">${d}</div>`;
  }

  wrap.innerHTML = `
    <div class="cal-nav">
      <button class="cal-nav-btn" onclick="calNav(-1)">‹</button>
      <span class="cal-month">${meses[month]} ${year}</span>
      <button class="cal-nav-btn" onclick="calNav(1)">›</button>
    </div>
    <div class="cal-grid">
      ${dias.map(d => `<div class="cal-day-name">${d}</div>`).join('')}
      ${cells}
    </div>
    <div style="display:flex;gap:12px;margin-top:10px;padding:0 4px;">
      <span style="font-size:10px;color:var(--text3);display:flex;align-items:center;gap:4px;">
        <span style="width:6px;height:6px;border-radius:50%;background:var(--orange);display:inline-block"></span>Tarefa
      </span>
      <span style="font-size:10px;color:var(--text3);display:flex;align-items:center;gap:4px;">
        <span style="width:6px;height:6px;border-radius:50%;background:var(--red);display:inline-block"></span>Atrasada
      </span>
    </div>`;
}

function calNav(dir) {
  calMonth += dir;
  if (calMonth > 11) { calMonth = 0; calYear++; }
  if (calMonth < 0) { calMonth = 11; calYear--; }
  renderCalendar(calYear, calMonth);
}

function renderMarkdown(text, cardId) {
  if (!text) return '<span style="color:var(--text3);font-style:italic">Nada escrito ainda...</span>';
  // Processar linha por linha para checkboxes clicáveis
  const lines = text.split('\n');
  let checkIdx = 0;
  const processed = lines.map(line => {
    // Checked
    if (/^- \[x\] /i.test(line)) {
      const label = line.replace(/^- \[x\] /i, '');
      const idx = checkIdx++;
      const safe = label.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      return `<li style="list-style:none;display:flex;align-items:flex-start;gap:8px;margin:3px 0;cursor:pointer;" onclick="toggleCheck('${cardId}',${idx})"><span style="width:18px;height:18px;border-radius:4px;background:var(--green);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;margin-top:1px;">✓</span><span style="text-decoration:line-through;color:var(--text3);flex:1;">${safe}</span></li>`;
    }
    // Unchecked
    if (/^- \[ \] /.test(line)) {
      const label = line.replace(/^- \[ \] /, '');
      const idx = checkIdx++;
      const safe = label.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      return `<li style="list-style:none;display:flex;align-items:flex-start;gap:8px;margin:3px 0;cursor:pointer;" onclick="toggleCheck('${cardId}',${idx})"><span style="width:18px;height:18px;border-radius:4px;border:2px solid var(--border2);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;transition:all 0.15s;"></span><span style="flex:1;">${safe}</span></li>`;
    }
    // Resto do markdown
    return line
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/^### (.+)$/, '<h3>$1</h3>')
      .replace(/^## (.+)$/, '<h2>$1</h2>')
      .replace(/^# (.+)$/, '<h1>$1</h1>')
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.+?)\*/g, '<em>$1</em>')
      .replace(/`(.+?)`/g, '<code>$1</code>')
      .replace(/^---$/, '<hr>')
      .replace(/^> (.+)$/, '<blockquote>$1</blockquote>')
      .replace(/^- (.+)$/, '<li>$1</li>')
      .replace(/^\d+\. (.+)$/, '<li>$1</li>');
  });
  return processed.join('<br>');
}

function toggleCheck(cardId, checkIndex) {
  const c = cards.find(x => x.id === cardId);
  if (!c || !c.notes) return;
  const lines = c.notes.split('\n');
  let idx = 0;
  c.notes = lines.map(line => {
    if (/^- \[x\] /i.test(line) || /^- \[ \] /.test(line)) {
      if (idx === checkIndex) {
        idx++;
        if (/^- \[x\] /i.test(line)) return line.replace(/^- \[x\] /i, '- [ ] ');
        return line.replace(/^- \[ \] /, '- [x] ');
      }
      idx++;
    }
    return line;
  }).join('\n');
  persist();
  // Atualizar preview sem fechar o modal
  const preview = document.getElementById('notesPreview');
  if (preview && preview.classList.contains('active')) {
    preview.innerHTML = renderMarkdown(c.notes, cardId);
  }
  // Atualizar indicador no card
  const cardEl = document.getElementById('card-' + cardId);
  if (cardEl) {
    const notesBadge = cardEl.querySelector('.card-has-notes');
    if (notesBadge) {
      const lines2 = c.notes.split('\n');
      notesBadge.textContent = `📝 ${lines2.length} linha${lines2.length > 1 ? 's' : ''} de anotações`;
    }
  }
}

function notesInsert(before, after) {
  const ta = document.getElementById('fNotes');
  if (!ta) return;
  const start = ta.selectionStart;
  const end = ta.selectionEnd;
  const selected = ta.value.substring(start, end);
  const newText = ta.value.substring(0, start) + before + (selected || 'texto') + after + ta.value.substring(end);
  ta.value = newText;
  ta.focus();
  ta.setSelectionRange(start + before.length, start + before.length + (selected || 'texto').length);
}

function notesInsertLine(prefix) {
  const ta = document.getElementById('fNotes');
  if (!ta) return;
  const start = ta.selectionStart;
  const before = ta.value.substring(0, start);
  const after = ta.value.substring(start);
  const needsNewline = before.length > 0 && !before.endsWith('\n');
  const insert = (needsNewline ? '\n' : '') + prefix;
  ta.value = before + insert + after;
  const pos = start + insert.length;
  ta.focus();
  ta.setSelectionRange(pos, pos);
}

// Resumo top (home e financeiro)

function calcTotais() {
  const today = todayStr();
  const mesAtual = today.slice(0, 7);
  const entradas = lancamentos.filter(l => l.tipo === 'entrada');
  const saidas = lancamentos.filter(l => l.tipo === 'saida');
  const totalEntradas = entradas.reduce((a, l) => a + parseFloat(l.valor || 0), 0);
  const totalSaidas = saidas.reduce((a, l) => a + parseFloat(l.valor || 0), 0);
  const aReceber = cards.filter(c => c.col !== 'done' && c.value > 0).reduce((a, c) => a + parseFloat(c.value || 0), 0);
  const recebidoCards = cards.filter(c => c.col === 'done' && c.value > 0).reduce((a, c) => a + parseFloat(c.value || 0), 0);
  return { totalEntradas, totalSaidas, aReceber, recebidoCards };
}

function renderFinResumo() {
  const el = document.getElementById('finResumoTop');
  if (!el) return;
  const { totalEntradas, totalSaidas, aReceber, recebidoCards } = calcTotais();

  const pendentes = lancamentos.filter(l => l.status === 'pendente').reduce((a,l) => a + parseFloat(l.valor||0), 0);

    <div class="fin-card"><div class="fin-label">= Saldo</div><div class="fin-value" style="color:${saldo>=0?'var(--green)':'var(--red)'};font-size:20px;">${fmtMoney(saldo)}</div></div>
    <div class="fin-card"><div class="fin-label">📋 A receber</div><div class="fin-value receivable" style="font-size:20px;">${fmtMoney(aReceber)}</div></div>`;
}

function renderLancamentos() {
  const el = document.getElementById('lancamentosList');

  // Popular select de meses
  const sel = document.getElementById('lancMesFilter');
  if (sel && sel.options.length <= 1) {

    const hoje = todayStr().slice(0,7);
    if (!meses.includes(hoje)) meses.unshift(hoje);
    sel.innerHTML = `<option value="">Todos os meses</option>` +
      meses.map(m => {
        const [y, mo] = m.split('-');
        const nomes = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
        return `<option value="${m}">${nomes[parseInt(mo)-1]} ${y}</option>`;
      }).join('');
  }

  const mesFilter = sel ? sel.value : '';
  let filtered = [...lancamentos];
  if (lancFiltroAtual !== 'todos') filtered = filtered.filter(l => l.tipo === lancFiltroAtual);
  if (mesFilter) filtered = filtered.filter(l => l.data.startsWith(mesFilter));
  filtered.sort((a, b) => b.data.localeCompare(a.data));

  if (!filtered.length) {
    el.innerHTML = '<div class="no-tasks" style="padding:24px">Nenhum lançamento encontrado</div>';
    return;

  const statusColor = { pago: 'var(--green)', pendente: 'var(--gold)', atrasado: 'var(--red)' };
  const statusLabel = { pago:'✅', pendente:'⏳', atrasado:'⚠️' };

  el.innerHTML = filtered.map(l => `
    <div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);">
      <div style="width:36px;height:36px;border-radius:9px;background:${l.tipo==='entrada'?'rgba(106,158,120,0.15)':'rgba(192,80,80,0.15)'};display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;">${l.tipo==='entrada'?'↑':'↓'}</div>
      <div style="flex:1;min-width:0;">
        <div style="font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(l.desc)}</div>
        <div style="font-size:10px;color:var(--text3);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;">
          <span>${catEmoji[l.cat]||''} ${l.cat}</span>
          <span>${fmtDate(l.data)}</span>
          ${l.formaPag ? `<span style="background:var(--surface3);padding:1px 6px;border-radius:5px;">${{pix:'PIX',transferencia:'TED',cartao_credito:'Créd.',cartao_debito:'Déb.',boleto:'Boleto',dinheiro:'Dinheiro',outro:'Outro'}[l.formaPag]||l.formaPag}</span>` : ''}
          ${l.parcelas > 1 ? `<span style="color:var(--gold);">${l.parcelas}x</span>` : ''}
          ${l.obs ? `<span>${esc(l.obs)}</span>` : ''}
        </div>
      </div>
      <div style="text-align:right;flex-shrink:0;">
        <div style="font-family:'Cormorant Garamond',serif;font-size:16px;font-weight:700;color:${l.tipo==='entrada'?'var(--green)':'var(--red)'};">${l.tipo==='entrada'?'+':'-'}${fmtMoney(parseFloat(l.valor))}</div>
        <div style="font-size:11px;color:${statusColor[l.status]};font-weight:600;">${statusLabel[l.status]} ${l.status}</div>
      </div>
      <div style="display:flex;gap:4px;flex-shrink:0;">
        <button class="card-btn" onclick="editLancamento('${l.id}')">✏️</button>
        <button class="card-btn" onclick="deleteLancamento('${l.id}')" style="color:var(--red)">🗑️</button>
      </div>
    </div>`).join('');
}

function renderCardsReceber() {
  const el = document.getElementById('cardsReceberList');
  if (!el) return;
  const aReceber = cards.filter(c => c.col !== 'done' && c.value > 0)
    .sort((a,b) => (a.payDate||'').localeCompare(b.payDate||''));
  if (!aReceber.length) {
    el.innerHTML = '<div style="padding:16px;font-size:12px;color:var(--text3);text-align:center;">Nenhum valor a receber nos cards</div>';
    return;
  }
  const catEmoji = { conteudo:'🎬', engenharia:'📐', prospeccao:'📞', pessoal:'🏠' };
  el.innerHTML = aReceber.map(c => `
    <div id="cr-${c.id}" style="display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);gap:8px;">
      <div style="min-width:0;flex:1;">
        <div style="font-size:12px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(c.title)}</div>
        <div style="font-size:10px;color:var(--text3);margin-top:2px;display:flex;align-items:center;gap:6px;">
          <span>${catEmoji[c.cat]||''} ${CAT_LABELS[c.cat]||''}</span>
          ${c.payDate ? `<span>💰 <input type="date" value="${c.payDate}" onchange="updateCardField('${c.id}','payDate',this.value)" style="background:none;border:none;color:var(--text3);font-size:10px;font-family:Syne,sans-serif;cursor:pointer;width:90px;" /></span>` : `<button onclick="addPayDate('${c.id}')" style="background:none;border:1px dashed var(--border2);color:var(--text3);border-radius:5px;padding:1px 6px;font-size:10px;cursor:pointer;font-family:Syne,sans-serif;">+ data pagto</button>`}
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:6px;flex-shrink:0;">
        <div style="text-align:right;">
          <div style="font-size:10px;color:var(--text3);margin-bottom:2px;">R$</div>
          <input type="number" value="${c.value}" min="0" step="0.01"
            onchange="updateCardField('${c.id}','value',parseFloat(this.value)||0)"
            style="width:70px;background:var(--surface3);border:1px solid var(--border2);border-radius:6px;padding:3px 6px;color:var(--gold);font-family:'Cormorant Garamond',serif;font-size:15px;font-weight:700;text-align:right;" />

        </div>
      </div>
    </div>`).join('');
}

function updateCardField(id, field, value) {
  const c = cards.find(x => x.id === id);
  if (!c) return;
  c[field] = value;
  persist();
  renderFinResumo();
  renderFinResumoHome();
}

function addPayDate(id) {
  const c = cards.find(x => x.id === id);
  if (!c) return;
  c.payDate = todayStr();
  persist();
  renderCardsReceber();
}

function markCardPaid(id) {
  const c = cards.find(x => x.id === id);
  if (!c) return;
  // Criar lançamento de entrada automaticamente
  lancamentos.push({
    id: uid(),
    desc: c.title,
    valor: parseFloat(c.value||0),
    tipo: 'entrada',
    data: c.payDate || todayStr(),
    cat: c.cat,
    status: 'pago',
    obs: 'Gerado do card',
  });
  c.col = 'done';
  persist();
  saveLancs();
  renderFinanceiro();
  renderFinResumoHome();
  showToast('✅ Marcado como recebido e lançado!');
}

function renderFinGrafico() {
  const el = document.getElementById('finGrafico');
  if (!el) return;
  const nomes = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const hoje = new Date();
  const meses = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(hoje.getFullYear(), hoje.getMonth() - i, 1);
    meses.push({ key: `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`, label: nomes[d.getMonth()] });
  }
  const maxVal = Math.max(...meses.map(m => {
    const e = lancamentos.filter(l => l.tipo==='entrada' && l.data.startsWith(m.key)).reduce((a,l)=>a+parseFloat(l.valor||0),0);
    const s = lancamentos.filter(l => l.tipo==='saida'   && l.data.startsWith(m.key)).reduce((a,l)=>a+parseFloat(l.valor||0),0);
    return Math.max(e, s);
  }), 1);

  el.innerHTML = `
    <div style="display:flex;align-items:flex-end;gap:8px;height:120px;padding-bottom:24px;position:relative;">
      ${meses.map(m => {
        const e = lancamentos.filter(l=>l.tipo==='entrada'&&l.data.startsWith(m.key)).reduce((a,l)=>a+parseFloat(l.valor||0),0);
        const s = lancamentos.filter(l=>l.tipo==='saida'&&l.data.startsWith(m.key)).reduce((a,l)=>a+parseFloat(l.valor||0),0);
        const eh = Math.round((e/maxVal)*90);
        const sh = Math.round((s/maxVal)*90);
        return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;">
          <div style="width:100%;display:flex;gap:2px;align-items:flex-end;height:90px;">
            <div style="flex:1;background:var(--green);opacity:0.7;border-radius:3px 3px 0 0;height:${eh}px;" title="Entrada: ${fmtMoney(e)}"></div>
            <div style="flex:1;background:var(--red);opacity:0.7;border-radius:3px 3px 0 0;height:${sh}px;" title="Saída: ${fmtMoney(s)}"></div>
          </div>
          <span style="font-size:9px;color:var(--text3);font-weight:600;position:absolute;bottom:0;">${m.label}</span>
        </div>`;
      }).join('')}
    </div>
    <div style="display:flex;gap:14px;justify-content:center;margin-top:4px;">
      <span style="font-size:10px;color:var(--green);font-weight:600;display:flex;align-items:center;gap:4px;"><span style="width:8px;height:8px;background:var(--green);border-radius:2px;display:inline-block;opacity:0.7;"></span>Entradas</span>
      <span style="font-size:10px;color:var(--red);font-weight:600;display:flex;align-items:center;gap:4px;"><span style="width:8px;height:8px;background:var(--red);border-radius:2px;display:inline-block;opacity:0.7;"></span>Saídas</span>
    </div>`;
}

// Lançamento CRUD
function setTipoLanc(tipo) {
  lancTipoAtual = tipo;
  const be = document.getElementById('btnEntrada');
  const bs = document.getElementById('btnSaida');
  if (tipo === 'entrada') {
    be.style.borderColor = 'var(--green)'; be.style.background = 'rgba(106,158,120,0.15)'; be.style.color = 'var(--green)';
    bs.style.borderColor = 'var(--border2)'; bs.style.background = 'none'; bs.style.color = 'var(--text3)';
  } else {
    bs.style.borderColor = 'var(--red)'; bs.style.background = 'rgba(192,80,80,0.15)'; bs.style.color = 'var(--red)';
    be.style.borderColor = 'var(--border2)'; be.style.background = 'none'; be.style.color = 'var(--text3)';
  }
}

function openLancamento() {
  lancEditId = null;
  document.getElementById('lancModalTitle').textContent = 'Novo Lançamento';
  document.getElementById('lDesc').value = '';
  document.getElementById('lValor').value = '';
  document.getElementById('lData').value = todayStr();
  document.getElementById('lCat').value = 'conteudo';
  document.getElementById('lStatus').value = 'pago';
  document.getElementById('lObs').value = '';
  document.getElementById('lFormaPag').value = 'pix';
  document.getElementById('lParcelas').value = '1';
  document.getElementById('parcelaInfo').style.display = 'none';
  setTipoLanc('entrada');
  document.getElementById('lancOverlay').classList.add('show');
  setTimeout(() => document.getElementById('lDesc').focus(), 80);
}

function editLancamento(id) {
  const l = lancamentos.find(x => x.id === id);
  if (!l) return;
  lancEditId = id;
  document.getElementById('lancModalTitle').textContent = 'Editar Lançamento';
  document.getElementById('lDesc').value = l.desc;
  document.getElementById('lValor').value = l.valor;
  document.getElementById('lData').value = l.data;
  document.getElementById('lCat').value = l.cat;
  document.getElementById('lStatus').value = l.status;
  document.getElementById('lObs').value = l.obs || '';
  document.getElementById('lFormaPag').value = l.formaPag || 'pix';
  document.getElementById('lParcelas').value = l.parcelas || '1';
  document.getElementById('parcelaInfo').style.display = 'none';
  setTipoLanc(l.tipo);
  document.getElementById('lancOverlay').classList.add('show');
}

function closeLancamento() {
  document.getElementById('lancOverlay').classList.remove('show');
  lancEditId = null;
}

function saveLancamento() {
  const desc = document.getElementById('lDesc').value.trim();
  const valor = parseFloat(document.getElementById('lValor').value);
  if (!desc || !valor) return;
  const data = {
    desc, valor,
    tipo: lancTipoAtual,
    data: document.getElementById('lData').value || todayStr(),
    cat: document.getElementById('lCat').value,
    status: document.getElementById('lStatus').value,
    obs: document.getElementById('lObs').value.trim(),
  };
  if (lancEditId) {
    const idx = lancamentos.findIndex(l => l.id === lancEditId);
    if (idx > -1) lancamentos[idx] = { ...lancamentos[idx], ...data };
  } else {
    lancamentos.push({ id: uid(), ...data });
  }
  saveLancs();
  closeLancamento();
  renderFinanceiro();
  // Atualizar resumo na home também
  renderFinResumoHome();
}

function deleteLancamento(id) {
  lancamentos = lancamentos.filter(l => l.id !== id);
  saveLancs();
  renderFinanceiro();
  renderFinResumoHome();
}

function setLancFiltro(f, btn) {
  lancFiltroAtual = f;
  document.querySelectorAll('#page-financeiro .filter-chip').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderLancamentos();
}

// Renderizar home na inicialização
setTimeout(() => renderHome(), 100);

      </div>

    </div>
  </div>
</div>

<!-- MODAL LANÇAMENTO -->
<div class="overlay" id="lancOverlay" onclick="if(event.target===this)closeLancamento()">
  <div class="modal" style="max-width:460px;">
    <div class="modal-title" id="lancModalTitle">Novo Lançamento</div>

    <div class="form-group">
      <label class="form-label">Tipo *</label>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
        <button id="btnEntrada" onclick="setTipoLanc('entrada')" style="padding:10px;border-radius:9px;border:2px solid var(--green);background:rgba(106,158,120,0.15);color:var(--green);font-family:Syne,sans-serif;font-weight:700;font-size:13px;cursor:pointer;">↑ Entrada</button>
        <button id="btnSaida" onclick="setTipoLanc('saida')" style="padding:10px;border-radius:9px;border:2px solid var(--border2);background:none;color:var(--text3);font-family:Syne,sans-serif;font-weight:700;font-size:13px;cursor:pointer;">↓ Saída</button>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Descrição *</label>
      <input class="form-input" id="lDesc" type="text" placeholder="Ex: Cachê D Bianco, Aluguel, Material..." />
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Valor total (R$) *</label>
        <div class="currency-wrap">
          <span class="currency-symbol">R$</span>
          <input class="form-input" id="lValor" type="number" min="0" step="0.01" placeholder="0,00" oninput="updateParcelaCalc()" />
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Data *</label>
        <input class="form-input" id="lData" type="date" />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Forma de pagamento</label>
        <select class="form-select" id="lFormaPag">
          <option value="pix">PIX</option>
          <option value="transferencia">Transferência</option>
          <option value="cartao_credito">Cartão Crédito</option>
          <option value="cartao_debito">Cartão Débito</option>
          <option value="boleto">Boleto</option>
          <option value="dinheiro">Dinheiro</option>
          <option value="outro">Outro</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Parcelas</label>
        <select class="form-select" id="lParcelas" onchange="updateParcelaCalc()">
          <option value="1">À vista</option>
          <option value="2">2x</option>
          <option value="3">3x</option>
          <option value="4">4x</option>
          <option value="6">6x</option>
          <option value="10">10x</option>
          <option value="12">12x</option>
        </select>
      </div>
    </div>

    <div id="parcelaInfo" style="display:none;background:var(--surface2);border-radius:9px;padding:10px 14px;margin-bottom:14px;font-size:12px;color:var(--text2);">
      <span id="parcelaText"></span>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Categoria</label>
        <select class="form-select" id="lCat">
          <option value="conteudo">🎬 Conteúdo</option>
          <option value="engenharia">📐 Engenharia</option>
          <option value="prospeccao">📞 Prospecção</option>
          <option value="outros">📦 Outros</option>
          <option value="fixo">🏠 Fixo</option>
          <option value="investimento">📈 Investimento</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Status</label>
        <select class="form-select" id="lStatus">
          <option value="pago">✅ Pago / Recebido</option>
          <option value="pendente">⏳ Pendente</option>
          <option value="atrasado">⚠️ Atrasado</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Observação</label>
      <input class="form-input" id="lObs" type="text" placeholder="Nota fiscal, cliente, referência..." />
    </div>

    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeLancamento()">Cancelar</button>
      <button class="btn-primary" onclick="saveLancamento()">Salvar</button>
    </div>
  </div>
</div>

<!-- INFO MODAL -->
<div class="overlay" id="infoOverlay" onclick="if(event.target===this)closeInfoModal()">
  <div class="info-modal">
    <div class="modal-title">Informação Importante</div>
    <div class="form-group">
      <label class="form-label">Título *</label>
      <input class="form-input" id="iTitle" type="text" placeholder="Ex: Login Instagram, Drive, Tabela..." />
    </div>
    <div class="form-group">
      <label class="form-label">Conteúdo</label>
      <textarea class="form-textarea" id="iBody" placeholder="Usuário, senha, link, notas..." style="min-height:100px"></textarea>
    </div>
    <div class="form-group">
      <label class="form-label">Área</label>
      <select class="form-select" id="iArea">
        <option value="geral">Geral</option>
        <option value="conteudo">🎬 Conteúdo</option>
        <option value="engenharia">📐 Engenharia</option>
        <option value="prospeccao">📞 Prospecção</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeInfoModal()">Cancelar</button>
      <button class="btn-primary" onclick="saveInfo2()">Salvar</button>
    </div>
  </div>
</div>
</body>
</html>
